<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Jeopardy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#050a3a;--blue:#0a1fc4;--blue2:#0816a0;--gold:#f9c846;--ink:#eef0ff;--mute:#8e96d8;--ok:#1fbf6a;--bad:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.disp{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:.55em 1em;background:#2a36b8;font-weight:600}
button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.gold{background:var(--gold);color:#1a1400}button.ok{background:var(--ok);color:#03210f}button.bad{background:var(--bad)}button.ghost{background:transparent;border:1px solid #3a46c8}
button.on{background:var(--gold);color:#1a1400}
input,textarea{background:#0b1160;border:1px solid #3a46c8;border-radius:6px;padding:.5em .6em;width:100%}
textarea{resize:vertical;min-height:3.2em}
.hide{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:#0b1160;border:1px solid #2a36b8;border-radius:12px;padding:1.5rem;width:min(420px,100%)}
.card h1{font-size:2rem;color:var(--gold);margin-bottom:.8rem}.card>*+*{margin-top:.8rem}
/* host */
#host{display:grid;grid-template-columns:1fr 270px;min-height:100vh}
@media(max-width:900px){#host{grid-template-columns:1fr}}
#main{padding:1rem;min-width:0}
#side{padding:1rem;background:#070d52;border-left:1px solid #1b27a0}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.bar .sp{flex:1}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cat,.tile{display:grid;place-items:center;text-align:center;background:var(--blue);border-radius:3px}
.cat{min-height:84px;padding:.4rem;font:700 clamp(.8rem,1.7vw,1.4rem)/1.1 Oswald,sans-serif;text-transform:uppercase;color:#fff;background:var(--blue2)}
.tile{min-height:clamp(60px,11vh,110px);font:700 clamp(1.6rem,4vw,3.4rem) Oswald,sans-serif;color:var(--gold);text-shadow:3px 3px 0 #000;border-radius:3px}
.tile.used{background:#070d52;color:transparent;text-shadow:none;cursor:default}
#qrbox{background:#fff;padding:8px;border-radius:8px;width:max-content;margin:.5rem auto;cursor:zoom-in}
.url{font-size:.8rem;color:var(--mute);word-break:break-all;text-align:center}
.pl{display:flex;align-items:center;gap:.4rem;padding:.35rem 0;border-bottom:1px solid #1b27a0}
.pl .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .n.off{color:var(--mute)}.pl .s{background:transparent;border:1px solid #3a46c8;min-width:4.2em;padding:.2em .5em;font-variant-numeric:tabular-nums}
.pl .x{background:transparent;color:var(--mute);padding:.2em .5em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.dot.off{background:#555}
.overlay{position:fixed;inset:0;background:var(--blue);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem;text-align:center;overflow:auto}
.overlay .meta{color:var(--gold);font:700 1.4rem Oswald,sans-serif;text-transform:uppercase}
.overlay .clue{font:500 clamp(1.8rem,5vw,4rem)/1.25 Oswald,sans-serif;text-transform:uppercase;max-width:1100px;text-shadow:3px 3px 0 #000}
.overlay .ans{font:700 clamp(1.4rem,3vw,2.4rem) Oswald,sans-serif;color:var(--gold)}
.ctl{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center}
.ctl button{font-size:1.1rem;padding:.7em 1.2em}
.who{font:700 2.2rem Oswald,sans-serif;background:#000;padding:.2em .8em;border-radius:8px;color:var(--gold)}
table{border-collapse:collapse;background:#070d52;border-radius:8px;overflow:hidden}td,th{padding:.5rem .9rem;text-align:left}
/* editor */
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.ed .c{background:#0b1160;border:1px solid #2a36b8;border-radius:10px;padding:.8rem}.ed .c>*+*{margin-top:.4rem}
.ed .c input.nm{font-weight:700;color:var(--gold)}
.ed label{font-size:.8rem;color:var(--mute)}
/* player */
#player{min-height:100vh;display:flex;flex-direction:column;padding:1rem;gap:1rem}
#buzz{flex:1;min-height:55vh;border-radius:24px;font:700 clamp(3rem,16vw,7rem) Oswald,sans-serif;background:#444;color:#aaa;touch-action:manipulation}
#buzz.open{background:var(--ok);color:#03210f;box-shadow:0 12px 0 #138a4a}
#buzz.open:active{transform:translateY(8px);box-shadow:0 4px 0 #138a4a}
#buzz.out{background:#5a1a1d;color:#ffb3b5}#buzz.you{background:var(--gold);color:#1a1400}
#pinfo{display:flex;justify-content:space-between;font:700 1.3rem Oswald,sans-serif}
#pmsg{text-align:center;font-size:1.2rem;min-height:1.6em}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== SETTINGS =====
 Editor password hash (SHA-256). Default password is: changeme
 To change it: open the site, click "Make a new password hash" on the lock screen,
 then paste the result below and commit. */
const PASS_HASH="057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86";
const PREFIX="clubjep-";
/* ==================== */

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const qs=new URLSearchParams(location.search);
qs.get("room")?playerMode(qs.get("room")):lockScreen();

/* ================= HOST ================= */
const mk=()=>({cats:Array.from({length:6},(_,i)=>({name:"Category "+(i+1),clues:Array.from({length:5},(_,j)=>({q:"Clue "+(j+1),a:"Answer "+(j+1)}))}))});
let D;try{D=JSON.parse(localStorage.jdata)}catch(e){}
D=D||{r1:mk(),r2:mk(),fin:{cat:"Final category",q:"Final clue",a:"Final answer"}};
let S={};try{S=JSON.parse(localStorage.jstate)||{}}catch(e){}
let U=S.used||{r1:{},r2:{}}, P={}, phase="idle", buzzer=null, out=new Set(), cur=null, showAns=false, fin={stage:null};
let tab="board", round="r1", peer, room, tries=0;
const RV={r1:100,r2:200};
Object.entries(S.scores||{}).forEach(([n,s])=>P[n]={name:n,score:s,online:false});
const saveD=()=>localStorage.jdata=JSON.stringify(D);
const saveS=()=>localStorage.jstate=JSON.stringify({used:U,scores:Object.fromEntries(Object.values(P).map(p=>[p.name,p.score]))});

function lockScreen(){
  if(sessionStorage.jok==="1")return hostInit();
  app.innerHTML=`<div class="center"><form class="card" id="lf"><h1>Club Jeopardy</h1>
  <label>Host password<input id="pw" type="password" autocomplete="current-password" autofocus></label>
  <button class="gold" style="width:100%">Unlock host</button><div id="le" style="color:var(--bad)"></div>
  <details><summary style="cursor:pointer;color:var(--mute)">Make a new password hash</summary><input id="np" placeholder="New password" style="margin:.5rem 0"><button type="button" id="mh" class="ghost">Generate</button><p id="ho" class="url" style="text-align:left;user-select:all"></p></details></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();if(await sha($("#pw").value)===PASS_HASH){sessionStorage.jok="1";hostInit()}else $("#le").textContent="Wrong password."};
  $("#mh").onclick=async()=>{$("#ho").textContent=$("#np").value?await sha($("#np").value):""};
}

function hostInit(){
  app.innerHTML=`<div id="host"><div id="main"></div><aside id="side"></aside></div><div id="ov"></div>`;
  startRoom();renderSide();renderMain();
}
function startRoom(){
  room=localStorage.jroom||(localStorage.jroom=Math.random().toString(36).slice(2,6));
  peer=new Peer(PREFIX+room);
  peer.on("open",()=>{tries=0;renderSide()});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){ if(tries++<5)setTimeout(startRoom,2000); else{localStorage.jroom=Math.random().toString(36).slice(2,6);startRoom()} }
    else console.warn(e)});
  peer.on("connection",c=>{
    c.on("data",m=>onMsg(c,m));
    c.on("close",()=>{const p=P[c.pname];if(p&&p.conn===c){p.online=false;renderSide()}});
  });
}
function onMsg(c,m){
  if(m.t==="join"){
    let n=String(m.name||"").trim().slice(0,16)||"Player",p=P[n];
    if(p&&p.online&&!m.rejoin){let i=2;while(P[n+i])i++;n+=i;p=null}
    if(!p)p=P[n]={name:n,score:0};
    p.conn=c;p.online=true;c.pname=n;c.send({t:"joined",name:n});push();renderSide();saveS();return;
  }
  const p=P[c.pname];if(!p)return;
  if(m.t==="buzz"&&phase==="open"&&!out.has(p.name)){phase="buzzed";buzzer=p.name;push();renderOv()}
  if(m.t==="wager"&&phase==="final"&&fin.stage==="cat"){p.wager=Math.max(0,Math.min(Math.floor(+m.v)||0,Math.max(p.score,0)));push()}
  if(m.t==="fans"&&phase==="final"&&fin.stage==="clue"){p.fans=String(m.v).slice(0,200);push()}
}
function st(p){
  let s=phase;if(phase==="open"&&out.has(p.name))s="out";if(phase==="buzzed"&&buzzer===p.name)s="you";
  return {t:"s",s,buzzer,score:p.score,fin:fin.stage,cat:D.fin.cat,q:fin.stage==="clue"?D.fin.q:"",max:Math.max(p.score,0),wager:p.wager,ans:p.fans};
}
function push(){Object.values(P).forEach(p=>{if(p.online&&p.conn&&p.conn.open)p.conn.send(st(p))});}

function joinUrl(){return location.origin+location.pathname+"?room="+room}
function drawQR(el,size){el.innerHTML="";new QRCode(el,{text:joinUrl(),width:size,height:size})}
function renderSide(){
  const players=Object.values(P);
  $("#side").innerHTML=`<h2 style="font-size:1.4rem;color:var(--gold)">Join on your phone</h2>
  <div id="qrbox" title="Click to enlarge"></div><div class="url">${esc(joinUrl())}</div>
  <h3 style="margin:1rem 0 .3rem">Players (${players.filter(p=>p.online).length} online)</h3>
  ${players.length?"":'<p style="color:var(--mute)">Nobody yet. Scan the code.</p>'}
  ${players.sort((a,b)=>b.score-a.score).map(p=>`<div class="pl"><span class="dot ${p.online?"":"off"}"></span><span class="n ${p.online?"":"off"}">${esc(p.name)}</span>
  <button class="s" data-sc="${esc(p.name)}" title="Edit score">${p.score}</button><button class="x" data-rm="${esc(p.name)}" aria-label="Remove ${esc(p.name)}">×</button></div>`).join("")}
  <button class="ghost" id="ng" style="margin-top:1rem;width:100%">New game (reset scores and board)</button>`;
  drawQR($("#qrbox"),190);
  $("#qrbox").onclick=()=>{$("#ov").innerHTML=`<div class="overlay" style="background:#fff;color:#000"><div id="bq"></div><h2 style="font-size:2.4rem">Scan to join</h2><button class="gold" id="cq">Close</button></div>`;drawQR($("#bq"),Math.min(innerHeight*.6,innerWidth*.8));$("#cq").onclick=()=>$("#ov").innerHTML=""};
  $("#side").querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{const n=b.dataset.sc,v=prompt("Score for "+n,P[n].score);if(v!==null&&!isNaN(+v)){P[n].score=+v;saveS();push();renderSide()}});
  $("#side").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const n=b.dataset.rm;if(confirm("Remove "+n+"?")){P[n].conn&&P[n].conn.close();delete P[n];saveS();renderSide()}});
  $("#ng").onclick=()=>{if(confirm("Reset all scores and used clues?")){U={r1:{},r2:{}};Object.values(P).forEach(p=>{p.score=0;delete p.wager;delete p.fans;delete p.scored});phase="idle";fin={stage:null};cur=null;saveS();push();renderSide();renderMain();renderOv()}};
}
function renderMain(){
  const m=$("#main");
  const tabs=[["r1","Round 1"],["r2","Round 2"],["fin","Final Jeopardy"],["edit","Editor"]];
  const bar=`<div class="bar">${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}<span class="sp"></span></div>`;
  let body="";
  if(tab==="r1"||tab==="r2"){
    const R=D[tab];
    body=`<div class="board">${R.cats.map(c=>`<div class="cat">${esc(c.name)}</div>`).join("")}${
      [0,1,2,3,4].map(j=>R.cats.map((c,i)=>{const u=U[tab][i+"-"+j];return `<button class="tile ${u?"used":""}" data-c="${i}" data-j="${j}" ${u?"disabled":""}>$${RV[tab]*(j+1)}</button>`}).join("")).join("")}</div>`;
  }else if(tab==="fin"){
    body=`<div class="card" style="width:min(560px,100%)"><h1>Final Jeopardy</h1><p>Category: <b>${esc(D.fin.cat)}</b></p><p style="color:var(--mute)">Players set a wager on their phones, then type an answer. You score each one at the end.</p><button class="gold" id="sf">Start Final Jeopardy</button></div>`;
  }else body=editorHTML();
  m.innerHTML=bar+body;
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderMain()});
  m.querySelectorAll(".tile:not(.used)").forEach(b=>b.onclick=()=>openClue(+b.dataset.c,+b.dataset.j));
  if($("#sf"))$("#sf").onclick=()=>{Object.values(P).forEach(p=>{delete p.wager;delete p.fans;delete p.scored});phase="final";fin={stage:"cat"};push();renderOv()};
  if(tab==="edit")bindEditor();
}
function openClue(c,j){cur={r:tab,c,j};showAns=false;phase="locked";buzzer=null;out=new Set();push();renderOv()}
function closeClue(used){if(used&&cur)U[cur.r][cur.c+"-"+cur.j]=1;cur=null;phase="idle";buzzer=null;saveS();push();renderMain();renderOv()}

function renderOv(){
  const ov=$("#ov");
  if(phase==="final"){return renderFinal()}
  if(!cur){ov.innerHTML="";return}
  const R=D[cur.r],cat=R.cats[cur.c],cl=cat.clues[cur.j],val=RV[cur.r]*(cur.j+1);
  let ctl="";
  if(phase==="locked")ctl=`<button class="gold" id="ob">Open buzzers</button>`;
  if(phase==="open")ctl=`<span style="font-size:1.4rem">Buzzers open…</span><button id="lb">Lock buzzers</button>`;
  if(phase==="buzzed")ctl=`<span class="who">${esc(buzzer)}</span><button class="ok" id="ok">Correct +${val}</button><button class="bad" id="no">Incorrect −${val}</button>`;
  ov.innerHTML=`<div class="overlay"><div class="meta">${esc(cat.name)} · $${val}</div><div class="clue">${esc(cl.q)}</div>
  ${showAns?`<div class="ans">${esc(cl.a)}</div>`:""}
  <div class="ctl">${ctl}</div>
  <div class="ctl"><button class="ghost" id="sa">${showAns?"Hide":"Show"} answer</button><button class="ghost" id="done">Done (mark used)</button><button class="ghost" id="back">Back (keep unused)</button></div></div>`;
  const on=(id,f)=>$(id)&&($(id).onclick=f);
  on("#ob",()=>{phase="open";push();renderOv()});
  on("#lb",()=>{phase="locked";push();renderOv()});
  on("#sa",()=>{showAns=!showAns;renderOv()});
  on("#done",()=>closeClue(true));on("#back",()=>closeClue(false));
  on("#ok",()=>{P[buzzer].score+=val;showAns=true;saveS();renderSide();closeClue(true)});
  on("#no",()=>{P[buzzer].score-=val;out.add(buzzer);buzzer=null;phase="open";saveS();renderSide();push();renderOv()});
}
function renderFinal(){
  const ov=$("#ov"),f=D.fin,ps=Object.values(P);
  let body="",ctl="";
  if(fin.stage==="cat"){body=`<div class="clue">${esc(f.cat)}</div><p>Players are placing wagers…</p><table>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.wager!=null?"$"+p.wager:"…"}</td></tr>`).join("")}</table>`;ctl=`<button class="gold" id="n1">Show clue, collect answers</button>`}
  if(fin.stage==="clue"){body=`<div class="meta">${esc(f.cat)}</div><div class="clue">${esc(f.q)}</div><table>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.fans!=null?"answered":"…"}</td></tr>`).join("")}</table>`;ctl=`<button class="gold" id="n2">Reveal answers</button>`}
  if(fin.stage==="reveal"){body=`<div class="meta">${esc(f.cat)}</div><div class="ans">${esc(f.a)}</div><table><tr><th>Player</th><th>Answer</th><th>Wager</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.name)} ($${p.score})</td><td>${esc(p.fans||"(none)")}</td><td>$${p.wager||0}</td><td>${p.scored?"scored":`<button class="ok" data-r="${esc(p.name)}" data-v="1">✓</button> <button class="bad" data-r="${esc(p.name)}" data-v="-1">✗</button>`}</td></tr>`).join("")}</table>`}
  ov.innerHTML=`<div class="overlay"><h2 class="meta">Final Jeopardy</h2>${body}<div class="ctl">${ctl}<button class="ghost" id="fx">Close final</button></div></div>`;
  const on=(id,f)=>$(id)&&($(id).onclick=f);
  on("#n1",()=>{fin.stage="clue";push();renderOv()});on("#n2",()=>{fin.stage="reveal";push();renderOv()});
  on("#fx",()=>{phase="idle";fin={stage:null};push();renderOv()});
  ov.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const p=P[b.dataset.r];p.score+=(+b.dataset.v)*(p.wager||0);p.scored=true;saveS();renderSide();push();renderFinal()});
}

/* ----- editor ----- */
function editorHTML(){
  const rnd=k=>`<h2 style="margin:1.2rem 0 .6rem;color:var(--gold)">${k==="r1"?"Round 1 ($100–$500)":"Round 2 ($200–$1000)"}</h2><div class="ed">${D[k].cats.map((c,i)=>`<div class="c"><input class="nm" data-k="${k}" data-c="${i}" data-f="name" value="${esc(c.name)}" aria-label="Category name">${c.clues.map((x,j)=>`<label>$${RV[k]*(j+1)} clue</label><textarea data-k="${k}" data-c="${i}" data-j="${j}" data-f="q">${esc(x.q)}</textarea><input data-k="${k}" data-c="${i}" data-j="${j}" data-f="a" value="${esc(x.a)}" placeholder="Answer" aria-label="Answer">`).join("")}</div>`).join("")}</div>`;
  return `<div class="bar"><span style="color:var(--mute)">Changes save automatically in this browser.</span><span class="sp"></span><button class="ghost" id="ex">Export JSON</button><button class="ghost" id="im">Import JSON</button><input type="file" id="fi" accept=".json" class="hide"></div>
  ${rnd("r1")}${rnd("r2")}<h2 style="margin:1.2rem 0 .6rem;color:var(--gold)">Final Jeopardy</h2><div class="ed"><div class="c"><label>Category</label><input data-k="fin" data-f="cat" value="${esc(D.fin.cat)}"><label>Clue</label><textarea data-k="fin" data-f="q">${esc(D.fin.q)}</textarea><label>Answer</label><input data-k="fin" data-f="a" value="${esc(D.fin.a)}"></div></div>`;
}
function bindEditor(){
  const m=$("#main");
  m.oninput=e=>{const d=e.target.dataset;if(!d.k)return;
    if(d.k==="fin")D.fin[d.f]=e.target.value;
    else if(d.f==="name")D[d.k].cats[+d.c].name=e.target.value;
    else D[d.k].cats[+d.c].clues[+d.j][d.f]=e.target.value;
    saveD()};
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="jeopardy-questions.json";a.click()};
  $("#im").onclick=()=>$("#fi").click();
  $("#fi").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.r1||!j.r2||!j.fin)throw 0;D=j;saveD();renderMain()}catch(x){alert("That file isn't a valid question set.")}};
}

/* ================= PLAYER ================= */
function playerMode(code){
  let name=localStorage.jname||"",conn,state={s:"wait"};
  const join=()=>{
    app.innerHTML=`<div class="center"><form class="card" id="jf"><h1>Join the game</h1><label>Your name<input id="nm" maxlength="16" value="${esc(name)}" autofocus autocomplete="nickname"></label><button class="gold" style="width:100%">Join</button></form></div>`;
    $("#jf").onsubmit=e=>{e.preventDefault();name=$("#nm").value.trim();if(!name)return;localStorage.jname=name;connect()};
  };
  const connect=()=>{
    app.innerHTML=`<div class="center"><p>Connecting…</p></div>`;
    const pr=new Peer();
    pr.on("open",()=>{conn=pr.connect(PREFIX+code,{reliable:true});
      conn.on("open",()=>conn.send({t:"join",name,rejoin:!!localStorage.jjoined}));
      conn.on("data",m=>{if(m.t==="joined"){name=m.name;localStorage.jname=name;localStorage.jjoined="1";ui()}if(m.t==="s"){state=m;ui()}});
      conn.on("close",()=>{app.innerHTML=`<div class="center"><p>Reconnecting…</p></div>`;setTimeout(()=>{pr.destroy();connect()},1500)});
    });
    pr.on("error",()=>{app.innerHTML=`<div class="center"><div class="card"><h1>Can't find the game</h1><p>Check that the host has the page open.</p><button class="gold" id="rt">Try again</button></div></div>`;$("#rt").onclick=()=>{pr.destroy();connect()}});
  };
  const ui=()=>{
    const s=state;
    if(s.s==="final"){
      app.innerHTML=`<div id="player"><div id="pinfo"><span>${esc(name)}</span><span>$${s.score}</span></div><div class="card" style="width:100%;max-width:none"><h1>Final Jeopardy</h1><p><b>${esc(s.cat)}</b></p>
      ${s.fin==="cat"?`<form id="wf"><label>Your wager (0–${s.max})<input id="wv" type="number" min="0" max="${s.max}" inputmode="numeric" value="${s.wager??""}" required></label><button class="gold" style="width:100%;margin-top:.6rem">Lock in wager</button></form>${s.wager!=null?`<p>Wager set: $${s.wager}</p>`:""}`:""}
      ${s.fin==="clue"?`<p>${esc(s.q)}</p><form id="af"><label>Your answer<input id="av" value="${esc(s.ans||"")}" maxlength="200" required></label><button class="gold" style="width:100%;margin-top:.6rem">Submit answer</button></form>${s.ans!=null?`<p>Submitted.</p>`:""}`:""}
      ${s.fin==="reveal"?`<p>Watch the main screen.</p>`:""}</div></div>`;
      if($("#wf"))$("#wf").onsubmit=e=>{e.preventDefault();conn.send({t:"wager",v:$("#wv").value})};
      if($("#af"))$("#af").onsubmit=e=>{e.preventDefault();conn.send({t:"fans",v:$("#av").value})};
      return;
    }
    const L={idle:"WAIT",locked:"WAIT",open:"BUZZ!",out:"OUT",buzzed:"WAIT",you:"YOU!"};
    const msg={idle:"Waiting for the next clue",locked:"Hold on. Buzzers open soon.",open:"",out:"Locked out for this clue",buzzed:s.buzzer?esc(s.buzzer)+" buzzed in":"",you:"You buzzed in first. Answer out loud!"}[s.s]||"";
    app.innerHTML=`<div id="player"><div id="pinfo"><span>${esc(name)}</span><span>$${s.score}</span></div><button id="buzz" class="${s.s}" ${s.s==="open"?"":"disabled"}>${L[s.s]||"WAIT"}</button><div id="pmsg">${msg}</div></div>`;
    const b=$("#buzz");
    if(s.s==="open"){const f=e=>{e.preventDefault();conn.send({t:"buzz"});if(navigator.vibrate)navigator.vibrate(60);b.disabled=true};b.onpointerdown=f}
  };
  name?connect():join();
}
</script>
</body>
</html>
