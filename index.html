<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Jeopardy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Stanford palette: identity.stanford.edu/design-elements/color */
:root{--cardinal:#8C1515;--cardinal-dk:#820000;--cardinal-lt:#B83A4B;--black:#2E2D29;--b90:#43423E;--b80:#585754;--b70:#6D6C69;
--fog:#DAD7CB;--fogl:#F4F4F4;--pa:#175E54;--pv:#279989;--poppy:#E98300;--illum:#FEDD5C;--spirit:#E04F39;--brick:#651C32;--sky:#67AFD2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--fogl);font:16px/1.45 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Source Serif 4",Georgia,serif;font-weight:700;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:.55em 1em;background:var(--b80);font-weight:600}
button:hover:not(:disabled){filter:brightness(1.15)}
:focus-visible{outline:3px solid var(--illum);outline-offset:2px}
button.primary{background:var(--cardinal);box-shadow:inset 0 0 0 1px var(--cardinal-lt)}
button.ok{background:var(--pa)}button.bad{background:var(--brick)}button.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--b70)}
button.on{background:var(--fog);color:var(--black)}
input,textarea,select{background:var(--b90);border:1px solid var(--b70);border-radius:6px;padding:.5em .6em;width:100%}
textarea{resize:vertical;min-height:3.2em}
.hide{display:none!important}.mute{color:var(--fog);opacity:.75}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:var(--b90);border-top:4px solid var(--cardinal);border-radius:8px;padding:1.5rem;width:min(440px,100%)}
.card h1{font-size:2rem;margin-bottom:.8rem}.card>*+*{margin-top:.8rem}
/* host console */
#host{display:grid;grid-template-columns:1fr 310px;min-height:100vh}
@media(max-width:950px){#host{grid-template-columns:1fr}}
#main{padding:1rem;min-width:0}
#side{padding:1rem;background:#242320;border-left:3px solid var(--cardinal)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}.bar .sp{flex:1}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cat{display:grid;place-items:center;text-align:center;background:var(--fog);color:var(--black);min-height:62px;padding:.3rem;font:700 .95rem/1.1 "Source Serif 4",serif;border-radius:3px}
.tile{position:relative;min-height:54px;background:var(--cardinal);color:var(--illum);font:700 1.5rem "Source Serif 4",serif;border-radius:3px;padding:0}
.tile.used{background:var(--b90);color:transparent;cursor:default}
.tile .star{position:absolute;top:2px;right:6px;font-size:.8rem;color:var(--poppy)}
#qrbox{background:#fff;padding:8px;border-radius:8px;width:max-content;margin:.5rem auto;cursor:zoom-in}
.url{font-size:.8rem;opacity:.7;word-break:break-all;text-align:center}
.pl{display:flex;align-items:center;gap:.3rem;padding:.35rem .2rem;border-bottom:1px solid var(--b90)}
.pl.hot{background:var(--pa);border-radius:6px}
.pl .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl .n.off{opacity:.55}
.pl button{padding:.2em .5em;background:transparent}
.pl .s{box-shadow:inset 0 0 0 1px var(--b70);min-width:4.2em;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--illum);color:var(--black);padding:.6em 1.2em;border-radius:8px;font-weight:700;z-index:30;box-shadow:0 4px 16px #0008}
.stat{text-align:center;font-weight:600;margin:.3rem 0}.stat.good{color:var(--pv)}.stat.warn{color:var(--poppy)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pv);flex:none}.dot.off{background:var(--b70)}
.mini{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}.mini button{padding:.3em .7em;font-size:.85rem}
#panel:not(:empty){background:var(--b90);border-left:6px solid var(--cardinal);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem}
.ph{display:flex;gap:.6rem;align-items:center;font-weight:700;margin-bottom:.4rem}
.badge{background:var(--poppy);color:var(--black);border-radius:4px;padding:.05em .5em;font-size:.85rem}
.pq{font:600 1.35rem/1.3 "Source Serif 4",serif;margin:.3rem 0}
.pa{color:var(--illum);margin-bottom:.6rem}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.who{font:700 1.4rem "Source Serif 4",serif;background:var(--illum);color:var(--black);padding:.1em .6em;border-radius:6px}
.ctl select{width:auto}.ctl input[type=number]{width:7em}
table{border-collapse:collapse;margin-top:.6rem}td,th{padding:.35rem .8rem;text-align:left;border-bottom:1px solid var(--b80)}
/* editor */
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.ed .c{background:var(--b90);border-top:3px solid var(--cardinal);border-radius:8px;padding:.8rem}.ed .c>*+*{margin-top:.4rem}
.ed input.nm{font:700 1rem "Source Serif 4",serif;color:var(--illum)}
.ed label{font-size:.85rem;opacity:.8}
.lrow{display:flex;justify-content:space-between;align-items:center}
button.dd{padding:.15em .6em;font-size:.8rem;background:transparent;box-shadow:inset 0 0 0 1px var(--b70)}
button.dd.on{background:var(--poppy);color:var(--black);box-shadow:none}
/* player */
#player{min-height:100vh;display:flex;flex-direction:column;padding:1rem;gap:1rem}
#buzz{flex:1;min-height:55vh;border-radius:24px;font:700 clamp(3rem,16vw,7rem) "Source Serif 4",serif;background:var(--b80);color:var(--fog);touch-action:manipulation}
#buzz.open{background:var(--pv);color:var(--black);box-shadow:0 12px 0 var(--pa)}
#buzz.open:active{transform:translateY(8px);box-shadow:0 4px 0 var(--pa)}
#buzz.out{background:var(--brick);color:var(--fog)}#buzz.you{background:var(--illum);color:var(--black)}
#pinfo{display:flex;justify-content:space-between;font:700 1.3rem "Source Serif 4",serif}
#pmsg{text-align:center;font-size:1.2rem;min-height:1.6em}
/* TV */
#tv{height:100vh;display:grid;grid-template-rows:1fr auto;overflow:hidden;cursor:none;background:var(--black)}
.tvmain{padding:2.2vh 2vw 1.2vh;min-height:0;display:flex;flex-direction:column}
.tvhead{font:600 min(2.2vw,3.6vh) "Source Serif 4",serif;color:var(--fog);margin-bottom:1.2vh;letter-spacing:.02em}
.tvboard{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto repeat(5,1fr);gap:.9vh .6vw;min-height:0}
.tvcat{display:grid;place-items:center;text-align:center;background:var(--fog);color:var(--black);padding:1.2vh .5vw;font:700 min(calc(12.6vw / var(--n,6)),3.8vh)/1.1 "Source Serif 4",serif;border-radius:.4vh}
.tvtile{display:grid;place-items:center;background:var(--cardinal);color:var(--illum);font:700 min(calc(30vw / var(--n,6)),9vh) "Source Serif 4",serif;border-radius:.4vh}
.tvtile.used{background:#3a3935;color:transparent}
.tvbar{display:flex;align-items:center;gap:1.2vw;padding:1.4vh 2vw;background:#1f1e1b;border-top:.6vh solid var(--cardinal);min-height:16vh}
.chip{flex:1;min-width:0;background:var(--b90);border-radius:.8vh;padding:1.2vh 1vw;text-align:center}
.chip.lead{background:var(--illum);color:var(--black)}
.cn{display:block;font:600 min(1.7vw,3vh) "Source Sans 3",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{display:block;font:700 min(3vw,5.5vh) "Source Serif 4",serif}
.chip.empty{background:none;opacity:.6;font-size:min(1.8vw,3vh)}
.more{font:600 min(1.6vw,2.8vh) "Source Sans 3";opacity:.7}
#tvqr{background:#fff;padding:.7vh;border-radius:.6vh;line-height:0;flex:none}
.tvclue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:0 4vw}
.tvclue .meta{font:600 min(2.4vw,4vh) "Source Serif 4",serif;color:var(--illum)}
.tvclue .q{font:600 min(4.6vw,8vh)/1.25 "Source Serif 4",serif;max-width:88vw}
.tvclue .a{font:700 min(3.6vw,6vh) "Source Serif 4",serif;color:var(--illum)}
.tvclue .live{font:700 min(3vw,5vh) "Source Sans 3";padding:.6vh 2vw;border-radius:1vh;background:var(--pv);color:var(--black)}
.tvclue .live.who{background:var(--illum);font:700 min(5vw,9vh) "Source Serif 4",serif}
.splash{font:700 min(9vw,15vh) "Source Serif 4",serif;color:var(--poppy)}
.tvlobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center}
.tvlobby h1{font-size:min(5vw,9vh)}
#tvqrbig{background:#fff;padding:1.4vh;border-radius:1vh;line-height:0}
.tvurl{font:600 min(2vw,3.4vh) "Source Sans 3";color:var(--fog)}
.names{display:flex;flex-wrap:wrap;gap:1vh 1vw;justify-content:center;max-width:80vw}
.names span{background:var(--b90);padding:.6vh 1.2vw;border-radius:99px;font-size:min(1.8vw,3vh)}
.tvtbl{font-size:min(1.9vw,3.4vh)}
.runners{font:600 min(2vw,3.4vh) "Source Sans 3",sans-serif;color:var(--fog)}
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1.5vw;min-height:0;padding:0 6vw}
.pod{flex:1;max-width:27vw;display:flex;flex-direction:column;align-items:center;padding-top:2vh;border-radius:1vh 1vh 0 0;text-align:center;overflow:hidden;color:var(--black)}
.pod.p1{height:50vh;background:var(--illum)}.pod.p2{height:39vh;background:var(--fog)}.pod.p3{height:30vh;background:var(--poppy)}.pod.empty{background:none}
.pn{font:700 min(3vw,5.4vh) "Source Serif 4",serif;padding:0 1vw;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font:700 min(3.6vw,6.5vh) "Source Serif 4",serif}
.pr{margin-top:auto;padding-bottom:1.5vh;font:700 min(5vw,9vh) "Source Serif 4",serif;opacity:.55}
.runnerups{display:flex;gap:2vw;justify-content:center;padding:2.5vh 0 .5vh;min-height:9vh}
.runner{display:flex;gap:1.2vw;align-items:baseline;background:var(--b90);padding:1.2vh 2vw;border-radius:1vh;font-size:min(2.2vw,4vh)}
.rise{animation:rise .9s ease-out both}@keyframes rise{from{transform:translateY(60%);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== SETTINGS =====
 Host password hash (SHA-256). Default password: changeme
 To change it: open the site, click "Make a new password hash" on the lock screen,
 paste the result below, commit. */
const PASS_HASH="057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86";
/* Paste your Firebase web-app config here (Project settings > Your apps > Web app).
   It's safe to keep in a public repo as long as you publish the database rules from firebase-rules.json. */
const FIREBASE_CONFIG={
  apiKey:"",
  authDomain:"",
  databaseURL:"",
  projectId:"",
  appId:""
};
/* ==================== */

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function toast(m){const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const money=n=>(n<0?"−":"")+"$"+Math.abs(n);
const bc="BroadcastChannel" in window?new BroadcastChannel("clubjep"):null;
const RV={r1:100,r2:200};

/* ---------- data ---------- */
const MAXC=8;
const mkCat=i=>({name:"Category "+(i+1),clues:Array.from({length:5},(_,j)=>({q:"Clue "+(j+1),a:"Answer "+(j+1)}))});
const mk=()=>({dd:[],cats:Array.from({length:6},(_,i)=>mkCat(i))});
const blank=()=>({r1:mk(),r2:mk(),fin:{cat:"Final category",q:"Final clue",a:"Final answer"}});
const csvEsc=v=>{v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCSV(D){
  const rows=[["round","category","value","clue","answer","daily_double"]];
  ["r1","r2"].forEach((k,ri)=>D[k].cats.forEach((c,i)=>c.clues.forEach((x,j)=>rows.push([ri+1,c.name,RV[k]*(j+1),x.q,x.a,(D[k].dd||[]).includes(i+"-"+j)?"yes":""]))));
  rows.push(["final",D.fin.cat,"",D.fin.q,D.fin.a,""]);
  return "\ufeff"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
}
function parseCSV(t){
  t=t.replace(/^\ufeff/,"");const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
function fromCSV(t){
  const rows=parseCSV(t).filter(r=>r.some(x=>x.trim()));
  const hdr=rows.shift().map(h=>h.trim().toLowerCase()),ix=n=>hdr.indexOf(n);
  if(ix("round")<0||ix("clue")<0||ix("answer")<0)throw new Error("Needs round, category, value, clue, answer columns.");
  const N=blank(),seen={r1:[],r2:[]},filled={r1:{},r2:{}};
  N.r1.dd=[];N.r2.dd=[];N.r1.cats=[];N.r2.cats=[];
  rows.forEach(r=>{
    const g=n=>(r[ix(n)]??"").trim(),rd=g("round").toLowerCase();
    if(rd.startsWith("f")){N.fin={cat:g("category")||N.fin.cat,q:r[ix("clue")]??"",a:r[ix("answer")]??""};return}
    const k=/2/.test(rd)?"r2":"r1",name=g("category");
    let ci=seen[k].indexOf(name);if(ci<0){if(seen[k].length>=MAXC)return;seen[k].push(name);ci=seen[k].length-1;N[k].cats.push(mkCat(ci));N[k].cats[ci].name=name;filled[k][ci]={}}
    let j=Math.round(+g("value")/RV[k])-1;
    if(!(j>=0&&j<5)||filled[k][ci][j]){j=0;while(j<5&&filled[k][ci][j])j++;if(j>4)return}
    filled[k][ci][j]=1;N[k].cats[ci].clues[j]={q:r[ix("clue")]??"",a:r[ix("answer")]??""};
    if(/^(y|1|t|x|d)/i.test(g("daily_double")))N[k].dd.push(ci+"-"+j);
  });
  ["r1","r2"].forEach(k=>{if(!N[k].cats.length)N[k].cats.push(mkCat(0))});
  return N;
}

/* ======================= HOST CONSOLE ======================= */
let D,S={},U,P={},phase="idle",buzzer=null,out=new Set(),cur=null,dd={},tvAns=false,fin={stage:null};
let started=false,locked=false,tab="r1",round="r1",etab="r1",peer,room,tries=0;
let podium=false,openedAt=0,hostOff=0;
function hostLoad(){
  try{D=JSON.parse(localStorage.jdata)}catch(e){}
  D=D||blank();["r1","r2"].forEach(k=>D[k].dd=D[k].dd||[]);
  try{S=JSON.parse(localStorage.jstate)||{}}catch(e){}
  U=S.used||{r1:{},r2:{}};started=!!S.started;
  Object.entries(S.scores||{}).forEach(([n,s])=>P[n]={name:n,score:s,online:false});
}
const saveD=()=>localStorage.jdata=JSON.stringify(D);
const saveS=()=>localStorage.jstate=JSON.stringify({used:U,started,scores:Object.fromEntries(Object.values(P).map(p=>[p.name,p.score]))});

function lockScreen(){
  if(sessionStorage.jok==="1")return hostInit();
  app.innerHTML=`<div class="center"><form class="card" id="lf"><h1>Club Jeopardy</h1>
  <label>Host password<input id="pw" type="password" autocomplete="current-password" autofocus></label>
  <button class="primary" style="width:100%">Unlock host console</button><div id="le" style="color:var(--spirit)"></div>
  <details><summary style="cursor:pointer" class="mute">Make a new password hash</summary><input id="np" placeholder="New password" style="margin:.5rem 0"><button type="button" id="mh" class="ghost">Generate</button><p id="ho" class="url" style="text-align:left;user-select:all"></p></details></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();if(await sha($("#pw").value)===PASS_HASH){sessionStorage.jok="1";hostInit()}else $("#le").textContent="Wrong password."};
  $("#mh").onclick=async()=>{$("#ho").textContent=$("#np").value?await sha($("#np").value):""};
}
function hostInit(){
  hostLoad();
  app.innerHTML=`<div id="host"><div id="main"></div><aside id="side"></aside></div><div id="ov"></div>`;
  if(bc)bc.onmessage=e=>{if(e.data==="hello")sync()};
  if(!localStorage.jdata)fetch("questions.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{D=fromCSV(t);saveD();renderMain()}).catch(()=>{});
  startRoom();renderSide();renderMain();
}
let hostStatus="Connecting…",rt=null,fbdb,uid,R,L=[],hostReady=false,win=0,buzzSnap={},buzzList=[],settleT=null;
const GRACE_MS=350; /* wait this long after the first buzz so a faster press that arrives late can still win */
const newCode=()=>Math.random().toString(36).slice(2,7);
const retry=ms=>{clearTimeout(rt);rt=setTimeout(startRoom,ms)};
const byId=id=>Object.values(P).find(p=>p.id===id);
const isMan=p=>!p.id||String(p.id).startsWith("man-");
function setStatus(s){hostStatus=s;if($("#side"))renderSide()}
function lis(ref,evt,cb){ref.on(evt,cb);L.push([ref,evt,cb])}
function detach(){L.forEach(([r,e,c])=>r.off(e,c));L=[];hostReady=false}
async function startRoom(){
  detach();clearTimeout(rt);
  room=localStorage.jroom||(localStorage.jroom=newCode());
  if(!FIREBASE_CONFIG.apiKey){setStatus("Firebase isn't set up yet (see FIREBASE_CONFIG in index.html)");return}
  try{
    setStatus("Connecting…");
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    uid=(await firebase.auth().signInAnonymously()).user.uid;
    fbdb=firebase.database();R=fbdb.ref("rooms/"+room);
    const hu=(await R.child("hostUid").once("value")).val();
    if(hu&&hu!==uid){localStorage.jroom=newCode();return startRoom()}
    if(!hu)await R.child("hostUid").set(uid);
    if((await R.child("hostUid").once("value")).val()!==uid)throw new Error("Couldn't claim the room. Check the database rules were published.");
    const [ps,stt]=await Promise.all([R.child("players").once("value"),R.child("state").once("value")]);
    win=(stt.val()&&stt.val().win)||0;
    Object.entries(ps.val()||{}).forEach(([id,v])=>{const p=P[v.name]||(P[v.name]={name:v.name,online:false});p.id=id;p.score=v.score||0});
    hostReady=true;
    lis(fbdb.ref(".info/connected"),"value",s=>{if(s.val()){R.child("hostOnline").onDisconnect().remove();R.child("hostOnline").set(true);setStatus("ok")}else setStatus("Offline. Reconnecting…")});
    lis(fbdb.ref(".info/serverTimeOffset"),"value",s=>{hostOff=s.val()||0});
    lis(R.child("joins"),"child_added",s=>onJoin(s.key,s.val()));
    lis(R.child("joins"),"child_changed",s=>onJoin(s.key,s.val()));
    lis(R.child("presence"),"value",s=>{const o=s.val()||{};Object.values(P).forEach(p=>{if(p.id&&!isMan(p))p.online=!!o[p.id]});renderSide()});
    lis(R.child("buzz"),"value",s=>{buzzSnap=s.val()||{};evalBuzz()});
    lis(R.child("wagers"),"value",s=>applyWagers(s.val()||{}));
    lis(R.child("answers"),"value",s=>applyAnswers(s.val()||{}));
    saveS();push();renderSide();
  }catch(e){console.warn(e);setStatus("Problem: "+(e.code||e.message)+". Retrying…");retry(5000)}
}
function onJoin(pid,v){
  if(!v||!v.name||byId(pid))return;
  let n=String(v.name).trim().slice(0,16)||"Player",ex=P[n];
  if(ex&&ex.online&&!isMan(ex)){let i=2;while(P[n+i])i++;n+=i;ex=null}
  if(!ex&&locked){R.child("banned/"+pid).set("closed");return}
  const p=ex||(P[n]={name:n,score:0});
  p.id=pid;p.online=true;R.child("banned/"+pid).remove();
  saveS();push();renderSide();
}
function applyWagers(o){
  Object.entries(o).forEach(([id,v])=>{const p=byId(id);if(!p)return;v=Math.floor(+v)||0;
    if(phase==="final"&&fin.stage==="cat")p.wager=Math.max(0,Math.min(v,Math.max(p.score,0)));
    else if(phase==="dd"&&dd.stage==="wager"&&dd.who===p.name){p.wager=Math.max(0,Math.min(v,ddMax(p)));const w=$("#ddw");if(w)w.value=p.wager}});
  if(phase==="final")renderPanel();
}
function applyAnswers(o){
  if(phase!=="final"||fin.stage!=="clue")return;
  Object.entries(o).forEach(([id,v])=>{const p=byId(id);if(p)p.fans=String(v).slice(0,200)});renderPanel();
}
const ddMax=p=>Math.max(p.score,cur?RV[cur.r]*5:0);
function computeBuzz(){
  buzzList=Object.entries(buzzSnap||{}).map(([id,v])=>({p:byId(id),v})).filter(x=>x.p&&x.v&&x.v.w===win&&!out.has(x.p.name)).map(x=>({name:x.p.name,t:x.v.t})).sort((a,b)=>a.t-b.t);
  buzzList.forEach(b=>{b.d=b.t-buzzList[0].t;b.r=Math.max(0,b.t-openedAt)});
}
function evalBuzz(){
  if(!cur||cur.dd||(phase!=="open"&&phase!=="buzzed"))return;
  computeBuzz();
  if(phase==="open"&&buzzList.length&&!settleT)settleT=setTimeout(()=>{settleT=null;if(phase!=="open")return;computeBuzz();if(!buzzList.length)return;buzzer=buzzList[0].name;phase="buzzed";push();renderSide();renderPanel()},GRACE_MS);
  renderPanel();sync();
}
function clearRound(all){
  clearTimeout(settleT);settleT=null;buzzSnap={};buzzList=[];
  if(hostReady){R.child("buzz").remove();if(all){R.child("wagers").remove();R.child("answers").remove()}}
}
function push(){
  if(hostReady){
    R.child("state").set({phase,win,buzzer:buzzer||null,out:[...out],fin:fin.stage||null,cat:D.fin.cat,q:fin.stage==="clue"?D.fin.q:"",
      dd:phase==="dd"?{who:dd.who||null,stage:dd.stage}:null,ddTop:cur?RV[cur.r]*5:0}).catch(e=>console.warn(e));
    const o={};Object.values(P).forEach(p=>{if(p.id&&!String(p.id).startsWith("man-"))o[p.id]={name:p.name,score:p.score};else if(p.id)o[p.id]={name:p.name,score:p.score}});
    R.child("players").set(o).catch(e=>console.warn(e));
  }
  sync();
}

    cur:cur&&{cat:cat.name,val,dd:cur.dd,ddWho:dd.who,ddStage:dd.stage,q:(cur.dd&&dd.stage!=="clue")?"":cl.q,a:tvAns?cl.a:""},

function openClue(c,j){
  cur={r:tab,c,j,dd:D[tab].dd.includes(c+"-"+j)};round=tab;tvAns=false;buzzer=null;out=new Set();dd={who:null,stage:"pick"};clearRound(true);

}
function closeClue(used){
  if(used&&cur)U[cur.r][cur.c+"-"+cur.j]=1;
  if(cur&&dd.who&&P[dd.who])delete P[dd.who].wager;
  cur=null;phase="idle";buzzer=null;clearRound();saveS();push();renderSide();renderMain();
}
const curVal=()=>RV[cur.r]*(cur.j+1);
function judge(name,ok){
  const p=P[name];if(!p)return;
  if(ok){p.score+=curVal();closeClue(true);return}
  p.score-=curVal();out.add(name);buzzer=null;if(phase==="buzzed"){win++;clearRound();openedAt=Date.now()+hostOff;phase="open"}
  saveS();push();renderSide();renderPanel();
}
function ddJudge(ok){const p=P[dd.who];if(!p)return;const w=Math.max(0,+$("#ddw").value||0);p.score+=ok?w:-w;closeClue(true)}

/* ----- editor ----- */
function editorHTML(){
  const sub=[["r1","Round 1 ($100–$500)"],["r2","Round 2 ($200–$1000)"],["fin","Final"]];
  let h=`<div class="bar">${sub.map(([k,l])=>`<button class="${etab===k?"on":""}" data-et="${k}">${l}</button>`).join("")}<span class="sp"></span>

  <p class="mute" style="margin:-.4rem 0 1rem">Edits save automatically in this browser. Export a CSV to back them up or edit in a spreadsheet. Commit it to your repo as <b>questions.csv</b> to load it on any computer.</p>`;
  if(etab==="fin")return h+`<div class="ed"><div class="c"><label>Category</label><input data-k="fin" data-f="cat" value="${esc(D.fin.cat)}"><label>Clue</label><textarea data-k="fin" data-f="q">${esc(D.fin.q)}</textarea><label>Answer</label><input data-k="fin" data-f="a" value="${esc(D.fin.a)}"></div></div>`;
  const k=etab;
  h+=`<div class="bar"><label style="display:flex;align-items:center;gap:.5rem">Categories (columns)<input id="nc" type="number" min="1" max="${MAXC}" value="${D[k].cats.length}" style="width:5em"></label><button class="ghost" id="ac" ${D[k].cats.length>=MAXC?"disabled":""}>+ Add category</button></div>`;
  return h+`<div class="ed">${D[k].cats.map((c,i)=>`<div class="c"><div class="lrow"><span class="mute">Category ${i+1}</span><button class="dd" data-rc="${i}">✕ Remove</button></div><input class="nm" data-k="${k}" data-c="${i}" data-f="name" value="${esc(c.name)}" aria-label="Category name">${c.clues.map((x,j)=>`<div class="lrow"><label>$${RV[k]*(j+1)}</label><button class="dd ${D[k].dd.includes(i+"-"+j)?"on":""}" data-dd="${i}-${j}" aria-pressed="${D[k].dd.includes(i+"-"+j)}">★ Daily Double</button></div><textarea data-k="${k}" data-c="${i}" data-j="${j}" data-f="q" aria-label="Clue">${esc(x.q)}</textarea><input data-k="${k}" data-c="${i}" data-j="${j}" data-f="a" value="${esc(x.a)}" placeholder="Answer" aria-label="Answer">`).join("")}</div>`).join("")}</div>`;
}
function removeCat(k,i){
  const R=D[k];if(R.cats.length<=1){alert("A board needs at least one category.");return}
  if(!confirm('Remove category "'+R.cats[i].name+'" and its clues?'))return;
  R.cats.splice(i,1);
  const mp=s=>{const [c,j]=s.split("-").map(Number);return c===i?null:(c>i?(c-1)+"-"+j:s)};
  R.dd=R.dd.map(mp).filter(Boolean);
  const nu={};Object.keys(U[k]).forEach(s=>{const m=mp(s);if(m)nu[m]=1});U[k]=nu;
  saveD();saveS();renderMain();
}
function setCols(k,n){
  const R=D[k];n=Math.max(1,Math.min(MAXC,Math.floor(n)||R.cats.length));
  if(n<R.cats.length){
    const d=R.cats.length-n;
    if(!confirm("Remove the last "+d+" categor"+(d>1?"ies":"y")+" and their clues?")){renderMain();return}
    R.cats.length=n;R.dd=R.dd.filter(s=>+s.split("-")[0]<n);
    const nu={};Object.keys(U[k]).forEach(s=>{if(+s.split("-")[0]<n)nu[s]=1});U[k]=nu;saveS();
  }
  while(R.cats.length<n)R.cats.push(mkCat(R.cats.length));
  saveD();renderMain();
}
function bindEditor(){
  const b=$("#body");
  b.oninput=e=>{const d=e.target.dataset;if(!d.k)return;
    if(d.k==="fin")D.fin[d.f]=e.target.value;
    else if(d.f==="name")D[d.k].cats[+d.c].name=e.target.value;
    else D[d.k].cats[+d.c].clues[+d.j][d.f]=e.target.value;
    saveD();sync()};
  if($("#nc"))$("#nc").onchange=e=>setCols(etab,+e.target.value);
  if($("#ac"))$("#ac").onclick=()=>{const a=D[etab].cats;if(a.length<MAXC){a.push(mkCat(a.length));saveD();renderMain()}};
  b.querySelectorAll("[data-rc]").forEach(x=>x.onclick=()=>removeCat(etab,+x.dataset.rc));
  b.querySelectorAll("[data-et]").forEach(x=>x.onclick=()=>{etab=x.dataset.et;renderMain()});
  b.querySelectorAll("[data-dd]").forEach(x=>x.onclick=()=>{const a=D[etab].dd,v=x.dataset.dd,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);x.classList.toggle("on",i<0);x.setAttribute("aria-pressed",i<0);saveD()});
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([toCSV(D)],{type:"text/csv"}));a.download="questions.csv";a.click()};
  $("#im").onclick=()=>$("#fi").click();
  $("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const N=fromCSV(await f.text());if(confirm("Replace all current questions with this file?")){D=N;saveD();renderMain()}}catch(x){alert("Couldn't read that CSV. "+x.message)}e.target.value=""};
  $("#lq").onclick=()=>fetch("questions.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{if(confirm("Replace all current questions with questions.csv from the site?")){D=fromCSV(t);saveD();renderMain()}}).catch(()=>alert("No questions.csv found next to index.html."));
}

/* ======================= TV DISPLAY ======================= */
let TS=null,lastQR="",podShown=false;
function podiumHTML(s){
  const first=!podShown;podShown=true;
  const L=s.top,rk=[];L.forEach((p,i)=>rk.push(i&&p.s===L[i-1].s?rk[i-1]:i+1));
  const ord=n=>n+((n%100>=11&&n%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"));
  if(!L.length)return `<div class="tvlobby"><h1 class="serif">Final standings</h1><p class="mute">No players yet.</p></div>`;
  const slot=(i,cls)=>L[i]?`<div class="pod ${cls}${first?" rise":""}"><div class="pn">${esc(L[i].n)}</div><div class="ps">${money(L[i].s)}</div><div class="pr">${ord(rk[i])}</div></div>`:`<div class="pod empty"></div>`;
  const rest=L.slice(3).map((p,k)=>`<div class="runner"><span>${ord(rk[k+3])}</span><b>${esc(p.n)}</b><span>${money(p.s)}</span></div>`).join("");
  return `<div class="tvhead" style="text-align:center">Final standings</div><div class="podium">${slot(1,"p2")}${slot(0,"p1")}${slot(2,"p3")}</div><div class="runnerups">${rest}</div>`;
}
function tvMode(){
  if(!bc){app.innerHTML=`<div class="center"><p>This browser can't link the TV window to the host console.</p></div>`;return}
  bc.onmessage=e=>{if(e.data&&typeof e.data==="object"){TS=e.data;renderTV()}};
  renderTV();bc.postMessage("hello");
  document.addEventListener("keydown",e=>{if(e.key==="f")document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
}
function renderTV(){
  const s=TS;
  if(!s){app.innerHTML=`<div id="tv"><div class="tvmain"><div class="tvlobby"><h1 class="serif">Waiting for the host console…</h1><p class="mute">Open the host page in another window on the same browser, then click "Open TV display". Press F here for full screen.</p></div></div></div>`;return}
  let main="",bar=true,big=false;
  if(!s.podium)podShown=false;
  if(s.podium){bar=false;main=podiumHTML(s)}
  else if(!s.started){
    bar=false;big=true;
    main=`<div class="tvlobby"><h1 class="serif">Scan to join the game</h1><div id="tvqrbig"></div><div class="tvurl">${esc(s.url)}</div>
    <div class="names">${s.names.map(n=>`<span>${esc(n)}</span>`).join("")}</div><div class="mute">${s.names.length?s.names.length+" joined":"Waiting for players…"}</div></div>`;
  }else if(s.fin){
    const f=s.fin;
    main=`<div class="tvclue"><div class="meta">Final Jeopardy</div>
    ${f.stage==="cat"?`<div class="splash" style="color:var(--illum);font-size:min(6vw,10vh)">${esc(f.cat)}</div><div class="meta">Enter your wager on your phone (${f.nw}/${f.no})</div>`:""}
    ${f.stage==="clue"?`<div class="meta">${esc(f.cat)}</div><div class="q">${esc(f.q)}</div><div class="meta">Answers in: ${f.na}/${f.no}</div>`:""}
    ${f.stage==="reveal"?`<div class="meta">${esc(f.cat)}</div><div class="a">${esc(f.a)}</div><table class="tvtbl">${f.rows.slice(0,8).map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.a)||"(none)"}</td><td>${money(r.w)}</td><td>${r.r==="ok"?"✓":r.r==="no"?"✗":""}</td></tr>`).join("")}</table>`:""}</div>`;
  }else if(s.cur){
    const c=s.cur;
    if(c.dd&&c.ddStage!=="clue")main=`<div class="tvclue"><div class="splash">Daily Double</div><div class="meta">${esc(c.cat)}</div><div class="meta">${c.ddWho?esc(c.ddWho)+" is wagering…":"Selecting a player…"}</div></div>`;
    else main=`<div class="tvclue"><div class="meta">${esc(c.cat)} · $${c.val}${c.dd?" · Daily Double":""}</div><div class="q">${esc(c.q)}</div>${c.a?`<div class="a">${esc(c.a)}</div>`:""}
      ${!c.dd&&s.phase==="open"?`<div class="live">Buzzers open</div>`:""}${!c.dd&&s.phase==="buzzed"?`<div class="live who">${esc(s.buzzer)}</div>`+((s.runners||[]).length?`<div class="runners">${s.runners.map((r,i)=>["2nd","3rd","4th"][i]+" "+esc(r.n)+" +"+r.d+" ms").join("  ·  ")}</div>`:""):""}${c.dd?`<div class="meta">${esc(c.ddWho||"")}</div>`:""}</div>`;
  }else{
    main=`<div class="tvhead">${s.rname}</div><div class="tvboard" style="--n:${s.cats.length};grid-template-columns:repeat(${s.cats.length},1fr)">${s.cats.map(n=>`<div class="tvcat">${esc(n)}</div>`).join("")}${
      [0,1,2,3,4].map(j=>s.cats.map((_,i)=>`<div class="tvtile ${s.used[i+"-"+j]?"used":""}">${s.used[i+"-"+j]?"":"$"+s.vals[j]}</div>`).join("")).join("")}</div>`;
  }
  const scorebar=bar?`<div class="tvbar">${s.top.length?s.top.map((t,i)=>`<div class="chip ${i===0&&t.s>0?"lead":""}"><span class="cn">${esc(t.n)}</span><span class="cs">${money(t.s)}</span></div>`).join(""):`<div class="chip empty">No players yet</div>`}${s.more?`<div class="more">+${s.more} more</div>`:""}<div id="tvqr" title="Scan to join"></div></div>`:"";
  app.innerHTML=`<div id="tv"><div class="tvmain">${main}</div>${scorebar}</div>`;
  const q=$("#tvqrbig")||$("#tvqr");
  if(q)new QRCode(q,{text:s.url,width:big?Math.round(innerHeight*.42):Math.round(innerHeight*.12),height:big?Math.round(innerHeight*.42):Math.round(innerHeight*.12)});
}

/* ======================= PLAYER ======================= */
function playerMode(code){
  const card=(t,p,btn,fn)=>{app.innerHTML=`<div class="center"><div class="card"><h1>${t}</h1><p>${p}</p>${btn?`<button class="primary" id="rb">${btn}</button>`:""}</div></div>`;if(btn)$("#rb").onclick=fn};
  if(!FIREBASE_CONFIG.apiKey)return card("Game not set up","The host hasn't finished setting up this site yet.");
  let name=localStorage.jname||"",uid,R,db,S={phase:"idle"},me=null,ban=null,hostOn=true,myW=null,myA=null,off=0,sent=-1,attached=false;
  const TS=()=>firebase.database.ServerValue.TIMESTAMP;
  const wagerForm=(max,w)=>`<form id="wf"><label>Your wager (0–${max})<input id="wv" type="number" min="0" max="${max}" inputmode="numeric" value="${w??""}" required></label><button class="primary" style="width:100%;margin-top:.6rem">Lock in wager</button></form>${w!=null?`<p>Wager set: $${w}</p>`:""}`;
  const ui=()=>{
    if(!R)return;
    const kA=$("#av")&&$("#av").value,kW=$("#wv")&&$("#wv").value;
    if(ban)return card(ban==="removed"?"You were removed":"Lobby is closed",ban==="removed"?"The host removed you from the game.":"The host isn't accepting new players right now.","Try joining again",()=>R.child("joins/"+uid).set({name,ts:TS()}));
    if(S.phase==="closed")return card("Room closed","The host started a new room. Scan the new QR code to join.");
    if(!me)return card("Joining…",hostOn?"Waiting for the host to let you in.":"The host page doesn't look like it's open yet. Hang tight.");
    if(me.name!==name){name=me.name;localStorage.jname=name}
    const score=me.score||0,top=`<div id="pinfo"><span>${esc(me.name)}</span><span>${money(score)}</span></div>`,warn=hostOn?"":`<div class="mute" style="text-align:center">The host looks offline…</div>`;
    let s=S.phase;const outList=S.out||[];
    if(s==="open"&&outList.includes(me.name))s="out";
    if(s==="buzzed"&&S.buzzer===me.name)s="you";
    if(s==="final"||s==="dd"){
      let body="";
      if(s==="final"){
        body=`<h1>Final Jeopardy</h1><p><b>${esc(S.cat)}</b></p>`+
        (S.fin==="cat"?wagerForm(Math.max(score,0),myW):"")+
        (S.fin==="clue"?`<p>${esc(S.q)}</p><form id="af"><label>Your answer<input id="av" value="${esc(myA||"")}" maxlength="200" required></label><button class="primary" style="width:100%;margin-top:.6rem">Submit answer</button></form>${myA!=null?"<p>Submitted.</p>":""}`:"")+
        (S.fin==="reveal"?"<p>Watch the main screen.</p>":"");
      }else{
        const d=S.dd||{},meUp=d.who===me.name;
        body=`<h1>Daily Double</h1>`+(d.stage==="pick"?"<p>The host is choosing a player.</p>":d.stage==="wager"?(meUp?wagerForm(Math.max(score,S.ddTop||0),myW):`<p>${esc(d.who)} is wagering.</p>`):(meUp?"<p>Answer out loud. The host will judge it.</p>":`<p>${esc(d.who)} is answering.</p>`));
      }
      app.innerHTML=`<div id="player">${top}<div class="card" style="width:100%;max-width:none">${body}</div>${warn}</div>`;
      if($("#wv")&&kW)$("#wv").value=kW;if($("#av")&&kA)$("#av").value=kA;
      if($("#wf"))$("#wf").onsubmit=e=>{e.preventDefault();R.child("wagers/"+uid).set(Math.max(0,Math.floor(+$("#wv").value)||0))};
      if($("#af"))$("#af").onsubmit=e=>{e.preventDefault();R.child("answers/"+uid).set($("#av").value.slice(0,200))};
      return;
    }
    const mine=s==="open"&&sent===S.win;
    const L={idle:"WAIT",locked:"WAIT",open:mine?"SENT":"BUZZ!",out:"OUT",buzzed:"WAIT",you:"YOU!"};
    const msg={idle:"Waiting for the next clue",locked:"Hold on. Buzzers open soon.",open:mine?"Locked in. Waiting for the result…":"",out:"Locked out for this clue",buzzed:S.buzzer?esc(S.buzzer)+" buzzed in":"",you:"You buzzed in first. Answer out loud!"}[s]||"";
    app.innerHTML=`<div id="player">${top}<button id="buzz" class="${s}" ${s==="open"&&!mine?"":"disabled"}>${L[s]||"WAIT"}</button><div id="pmsg">${msg}</div>${warn}</div>`;
    if(s==="open"&&!mine)$("#buzz").onpointerdown=e=>{e.preventDefault();if(sent===S.win)return;sent=S.win;
      R.child("buzz/"+uid).set({w:S.win,t:Date.now()+off}).catch(()=>{sent=-1;ui()});
      if(navigator.vibrate)navigator.vibrate(60);ui()};
  };
  const join=()=>{
    app.innerHTML=`<div class="center"><form class="card" id="jf"><h1>Join the game</h1><label>Your name<input id="nm" maxlength="16" value="${esc(name)}" autofocus autocomplete="nickname"></label><button class="primary" style="width:100%">Join</button></form></div>`;
    $("#jf").onsubmit=e=>{e.preventDefault();name=$("#nm").value.trim();if(!name)return;localStorage.jname=name;start()};
  };
  const start=async()=>{
    card("Connecting…","");
    try{
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      uid=(await firebase.auth().signInAnonymously()).user.uid;
      db=firebase.database();R=db.ref("rooms/"+code);
      if(!(await R.child("hostUid").once("value")).exists())return card("Room not found","Looking for room <b>"+esc(code)+"</b>. Make sure the host console is open and unlocked, with “Room online” showing, and that you scanned its current QR code.","Try again",start);
      if(!attached){attached=true;
        db.ref(".info/serverTimeOffset").on("value",s=>off=s.val()||0);
        db.ref(".info/connected").on("value",s=>{if(s.val()){const pr=R.child("presence/"+uid);pr.onDisconnect().remove();pr.set(true)}});
        R.child("state").on("value",s=>{S=s.val()||{phase:"idle"};ui()});
        R.child("players/"+uid).on("value",s=>{me=s.val();ui()});
        R.child("banned/"+uid).on("value",s=>{ban=s.val();ui()});
        R.child("hostOnline").on("value",s=>{hostOn=!!s.val();ui()});
        R.child("wagers/"+uid).on("value",s=>{myW=s.val();ui()});
        R.child("answers/"+uid).on("value",s=>{myA=s.val();ui()});
      }
      await R.child("joins/"+uid).set({name,ts:TS()});
      ui();
    }catch(e){card("Can't connect",esc(e.code||e.message||"Unknown error"),"Try again",start)}
  };
  name?start():join();
}

/* ======================= ROUTER (must stay last) ======================= */
const qs=new URLSearchParams(location.search);
if(qs.get("room"))playerMode(qs.get("room"));
else if(qs.has("tv"))tvMode();
else lockScreen();
</script>
