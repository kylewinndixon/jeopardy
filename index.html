<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Jeopardy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --cardinal:#8C1515;--cardinal-dk:#820000;--cardinal-lt:#B83A4B;
  --black:#2E2D29;--b90:#43423E;--b80:#585754;--b70:#6D6C69;
  --fog:#DAD7CB;--fogl:#F4F4F4;--pa:#175E54;--pv:#279989;
  --poppy:#E98300;--illum:#FEDD5C;--spirit:#E04F39;--brick:#651C32;
  --sky:#67AFD2
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;background:var(--black);color:var(--fogl);
  font:16px/1.45 "Source Sans 3",system-ui,sans-serif
}
h1,h2,h3,.serif{font-family:"Source Serif 4",Georgia,serif;font-weight:700;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:.55em 1em;background:var(--b80);font-weight:600}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{cursor:not-allowed;opacity:.65}
:focus-visible{outline:3px solid var(--fogl);outline-offset:2px}
button.primary{background:var(--cardinal);box-shadow:inset 0 0 0 1px var(--cardinal-lt)}
button.ok{background:var(--pa)}
button.bad{background:var(--brick)}
button.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--b70)}
button.on{background:var(--cardinal);color:#fff;box-shadow:inset 0 0 0 2px var(--fogl)}
input,textarea,select{background:var(--b90);border:1px solid var(--b70);border-radius:6px;padding:.5em .6em;width:100%}
textarea{resize:vertical;min-height:3.2em}
.hide{display:none!important}
.mute{color:var(--fog);opacity:.75}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:var(--b90);border-top:4px solid var(--cardinal);border-radius:8px;padding:1.5rem;width:min(440px,100%)}
.card h1{font-size:2rem;margin-bottom:.8rem}
.card>*+*{margin-top:.8rem}

/* Host console */
#host{display:grid;grid-template-columns:1fr 310px;min-height:100vh}
@media(max-width:950px){#host{grid-template-columns:1fr}}
#main{padding:1rem;min-width:0}
#side{padding:1rem;background:#242320;border-left:3px solid var(--cardinal)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.bar .sp{flex:1}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cat{display:grid;place-items:center;text-align:center;background:var(--fog);color:var(--cardinal);min-height:62px;padding:.3rem;font:700 .95rem/1.1 "Source Serif 4",serif;border-radius:3px}
.tile{position:relative;min-height:54px;background:var(--cardinal);color:#fff;font:700 1.5rem "Source Serif 4",serif;border-radius:3px;padding:0}
.tile.used{background:var(--b90);color:transparent;cursor:default}
.tile .star{position:absolute;top:2px;right:6px;font-size:.8rem;color:#fff}
#qrbox{background:#fff;padding:8px;border-radius:8px;width:max-content;margin:.5rem auto;cursor:zoom-in}
.url{font-size:.8rem;opacity:.7;word-break:break-all;text-align:center}
.pl{display:flex;align-items:center;gap:.3rem;padding:.35rem .2rem;border-bottom:1px solid var(--b90)}
.pl.hot{background:var(--pa);border-radius:6px}
.pl .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .n.off{opacity:.55}
.pl button{padding:.2em .5em;background:transparent}
.pl .s{box-shadow:inset 0 0 0 1px var(--b70);min-width:4.2em;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--fogl);color:var(--cardinal);padding:.6em 1.2em;border-radius:8px;font-weight:700;z-index:30;box-shadow:0 4px 16px #0008}
.stat{text-align:center;font-weight:600;margin:.3rem 0}
.stat.good{color:var(--pv)}
.stat.warn{color:var(--poppy)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pv);flex:none}
.dot.off{background:var(--b70)}
.mini{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.mini button{padding:.3em .7em;font-size:.85rem}
#panel:not(:empty){background:var(--b90);border-left:6px solid var(--cardinal);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem}
.ph{display:flex;gap:.6rem;align-items:center;font-weight:700;margin-bottom:.4rem}
.badge{background:var(--cardinal-lt);color:#fff;border-radius:4px;padding:.05em .5em;font-size:.85rem}
.pq{font:600 1.35rem/1.3 "Source Serif 4",serif;margin:.3rem 0}
.pa{color:#fff;font-weight:600;margin-bottom:.6rem}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.who{font:700 1.4rem "Source Serif 4",serif;background:var(--cardinal);color:#fff;box-shadow:inset 0 0 0 2px var(--fogl);padding:.1em .6em;border-radius:6px}
.ctl select{width:auto}
.ctl input[type=number]{width:7em}
table{border-collapse:collapse;margin-top:.6rem}
td,th{padding:.35rem .8rem;text-align:left;border-bottom:1px solid var(--b80)}

/* Question editor */
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.ed .c{background:var(--b90);border-top:3px solid var(--cardinal);border-radius:8px;padding:.8rem}
.ed .c>*+*{margin-top:.4rem}
.ed input.nm{font:700 1rem "Source Serif 4",serif;color:var(--fogl)}
.ed label{font-size:.85rem;opacity:.8}
.fmtbar{position:sticky;top:0;z-index:5;background:var(--black);padding:.5rem 0;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--b80);margin-bottom:.8rem}
.fmtbar button{min-width:2.4em}
#fpv{flex:1;min-width:220px;padding:.3rem .6rem;background:var(--b90);border-radius:6px;min-height:2em}
.lrow{display:flex;justify-content:space-between;align-items:center}
button.dd{padding:.15em .6em;font-size:.8rem;background:transparent;box-shadow:inset 0 0 0 1px var(--b70)}
button.dd.on{background:var(--cardinal-lt);color:#fff;box-shadow:none}

/* Player screen */
#player{min-height:100vh;display:flex;flex-direction:column;padding:1rem;gap:1rem}
#buzz{flex:1;min-height:55vh;border-radius:24px;font:700 clamp(3rem,16vw,7rem) "Source Serif 4",serif;background:var(--b80);color:var(--fog);touch-action:manipulation}
#buzz.open{background:var(--pv);color:var(--black);box-shadow:0 12px 0 var(--pa)}
#buzz.open:active{transform:translateY(8px);box-shadow:0 4px 0 var(--pa)}
#buzz.out{background:var(--brick);color:var(--fog)}
#buzz.you{background:var(--cardinal);color:#fff}
#pinfo{display:flex;justify-content:space-between;font:700 1.3rem "Source Serif 4",serif}
#pmsg{text-align:center;font-size:1.2rem;min-height:1.6em}

/* TV display */
#tv{height:100vh;display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden;cursor:none;background:#241212}
.tvmain{padding:2vh 2vw 1.5vh;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-top:1vh solid var(--cardinal)}
.tvhead{font:600 min(2.2vw,3.6vh) "Source Serif 4",serif;color:var(--fog);margin-bottom:1vh;letter-spacing:.02em}
.tvboard{flex:1;display:grid;grid-template-rows:auto repeat(5,minmax(0,1fr));gap:.9vh .6vw;min-height:0;container-type:size}
.tvcat{display:grid;place-items:center;text-align:center;background:var(--fog);color:var(--cardinal);padding:1vh .4vw;font:700 min(calc(12.6vw / var(--n,6)),3.8vh)/1.1 "Source Serif 4",serif;font-size:min(calc(12.6cqw / var(--n,6)),4.2cqh);border-radius:.4vh;overflow:hidden;min-width:0}
.tvtile{display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden;background:var(--cardinal);color:#fff;font:700 min(calc(30vw / var(--n,6)),7vh) "Source Serif 4",serif;font-size:min(calc(28cqw / var(--n,6)),9cqh);border-radius:.4vh}
.tvtile.used{background:#3a3935;color:transparent}
.tvbar{display:flex;align-items:center;gap:1.2vw;padding:1.4vh 2vw;background:#1a0d0d;border-top:.6vh solid var(--cardinal);min-height:13vh}
.chip{flex:1;min-width:0;background:var(--b90);border-radius:.8vh;padding:1.2vh 1vw;text-align:center}
.chip.lead{background:var(--cardinal);color:#fff;box-shadow:inset 0 0 0 .35vh var(--fogl)}
.cn{display:block;font:600 min(1.7vw,3vh) "Source Sans 3",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{display:block;font:700 min(3vw,5.5vh) "Source Serif 4",serif}
.chip.empty{background:none;opacity:.6;font-size:min(1.8vw,3vh)}
.more{font:600 min(1.6vw,2.8vh) "Source Sans 3";opacity:.7}
#tvqr{background:#fff;padding:.7vh;border-radius:.6vh;line-height:0;flex:none}
.tvclue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:0 4vw}
.tvclue .meta{font:600 min(2.4vw,4vh) "Source Serif 4",serif;color:var(--fog)}
.tvclue .q{font:600 min(4.6vw,8vh)/1.25 "Source Serif 4",serif;max-width:88vw}
.tvclue .a{font:700 min(3.6vw,6vh) "Source Serif 4",serif;color:#fff}
.tvclue .live{font:700 min(3vw,5vh) "Source Sans 3";padding:.6vh 2vw;border-radius:1vh;background:var(--pv);color:var(--black)}
.tvclue .live.who{background:var(--cardinal);color:#fff;box-shadow:inset 0 0 0 .5vh var(--fogl);font:700 min(5vw,9vh) "Source Serif 4",serif}
.tvclue .live.countdown{background:var(--illum);color:var(--black);font-size:min(4vw,7vh);padding:1vh 3vw}
.splash{font:700 min(9vw,15vh) "Source Serif 4",serif;color:#fff;background:var(--cardinal);padding:.05em .45em;border-radius:1vh}
.tvlobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center}
.tvlobby h1{font-size:min(5vw,9vh)}
#tvqrbig{background:#fff;padding:1.4vh;border-radius:1vh;line-height:0}
.tvurl{font:600 min(2vw,3.4vh) "Source Sans 3";color:var(--fog)}
.names{display:flex;flex-wrap:wrap;gap:1vh 1vw;justify-content:center;max-width:80vw}
.names span{background:var(--b90);padding:.6vh 1.2vw;border-radius:99px;font-size:min(1.8vw,3vh)}
.tvtbl{font-size:min(1.9vw,3.4vh)}
.runners{font:600 min(2vw,3.4vh) "Source Sans 3",sans-serif;color:var(--fog)}

/* Judging transition: CSS and host timer both use 1.5 seconds. */
.tvresult{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh;min-width:45vw;min-height:35vh;padding:4vh 5vw;border-radius:2vh;color:#fff;animation:judgeTransition 1.5s ease both}
.tvresult.correct{background:var(--pa)}
.tvresult.incorrect{background:var(--brick)}
.tvresult .resultword{font:700 min(9vw,15vh)/1.05 "Source Serif 4",serif}
.tvresult .resultname{font:600 min(3vw,5vh) "Source Sans 3",sans-serif}
.tvresult .resultanswer{font:600 min(3.2vw,5.5vh)/1.25 "Source Serif 4",serif;max-width:80vw;overflow-wrap:anywhere}
.tvanswer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center;padding:2vh 4vw;min-height:0;overflow:hidden}
.tvanswer .meta{font:600 min(2.4vw,4vh) "Source Serif 4",serif;color:var(--fog)}
.tvanswer .q{font:600 min(4vw,7vh)/1.2 "Source Serif 4",serif;max-width:88vw;overflow-wrap:anywhere}
.tvanswer .a{font:700 min(4.2vw,7.5vh)/1.2 "Source Serif 4",serif;color:var(--illum);max-width:88vw;overflow-wrap:anywhere}
.tvanswer .label{font:700 min(2vw,3.5vh) "Source Sans 3",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--pv)}
@keyframes judgeTransition{
  0%{opacity:0;transform:scale(.78)}
  18%{opacity:1;transform:scale(1.06)}
  30%{opacity:1;transform:scale(1)}
  82%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.96)}
}

.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1.5vw;min-height:0;padding:0 6vw}
.pod{flex:1;max-width:27vw;display:flex;flex-direction:column;align-items:center;padding-top:2vh;border-radius:1vh 1vh 0 0;text-align:center;overflow:hidden;color:var(--black)}
.pod.p1{height:50vh;background:var(--cardinal);color:#fff}
.pod.p2{height:39vh;background:var(--fog)}
.pod.p3{height:30vh;background:#D2C295}
.pod.empty{background:none}
.pn{font:700 min(3vw,5.4vh) "Source Serif 4",serif;padding:0 1vw;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{font:700 min(3.6vw,6.5vh) "Source Serif 4",serif}
.pr{margin-top:auto;padding-bottom:1.5vh;font:700 min(5vw,9vh) "Source Serif 4",serif;opacity:.55}
.runnerups{display:flex;gap:2vw;justify-content:center;padding:2.5vh 0 .5vh;min-height:9vh}
.runner{display:flex;gap:1.2vw;align-items:baseline;background:var(--b90);padding:1.2vh 2vw;border-radius:1vh;font-size:min(2.2vw,4vh)}
.rise{animation:rise .9s ease-out both}
@keyframes rise{from{transform:translateY(60%);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== SETTINGS =====
   Host password hash: SHA-256 of "fearthetree".
   The Firebase configuration is retained from the existing site.
*/
const PASS_HASH="110ab5a683176ac1ae9d7334a30b5436df739ef896d0aa4e3c207e88e9b8e653";

const FIREBASE_CONFIG={
  apiKey:"AIzaSyDAc-Ukm5Hij1_y0VYo-tjr37VUgHHbnWI",
  authDomain:"spr-jeopardy.firebaseapp.com",
  databaseURL:"https://spr-jeopardy-default-rtdb.firebaseio.com",
  projectId:"spr-jeopardy",
  storageBucket:"spr-jeopardy.firebasestorage.app",
  messagingSenderId:"1000199377284",
  appId:"1:1000199377284:web:ef9f34995fe9755d060dd1"
};
/* ==================== */

const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function toast(m){
  const t=document.createElement("div");
  t.id="toast";t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/__(.+?)__/g,"<u>$1</u>").replace(/\n/g,"<br>");
const money=n=>(n<0?"−":"")+"$"+Math.abs(n);
const bc="BroadcastChannel" in window?new BroadcastChannel("clubjep"):null;
const RV={r1:100,r2:200};
const BUILD="2026-10-29-v5-answer-screen";
const ordn=n=>n+((n%100>=11&&n%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"));

/* ---------- data ---------- */
const FINAL_FLOOR=0,DD_FLOOR=0;
const MAXC=8;
const mkCat=i=>({name:"Category "+(i+1),clues:Array.from({length:5},(_,j)=>({q:"Clue "+(j+1),a:"Answer "+(j+1)}))});
const mk=()=>({dd:[],cats:Array.from({length:6},(_,i)=>mkCat(i))});
const blank=()=>({r1:mk(),r2:mk(),fin:{cat:"Final category",q:"Final clue",a:"Final answer"}});
const csvEsc=v=>{v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};

function toCSV(D){
  const rows=[["round","category","value","clue","answer","daily_double"]];
  ["r1","r2"].forEach((k,ri)=>D[k].cats.forEach((c,i)=>c.clues.forEach((x,j)=>rows.push([ri+1,c.name,RV[k]*(j+1),x.q,x.a,(D[k].dd||[]).includes(i+"-"+j)?"yes":""]))));
  rows.push(["final",D.fin.cat,"",D.fin.q,D.fin.a,""]);
  return "\ufeff"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
}

function parseCSV(t){
  t=t.replace(/^\ufeff/,"");
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c=='"'){
        if(t[i+1]=='"'){f+='"';i++}
        else q=false;
      }else f+=c;
    }else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){
      if(c=="\r"&&t[i+1]=="\n")i++;
      r.push(f);f="";rows.push(r);r=[];
    }else f+=c;
  }
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}

function fromCSV(t){
  const rows=parseCSV(t).filter(r=>r.some(x=>x.trim()));
  const hdr=rows.shift().map(h=>h.trim().toLowerCase()),ix=n=>hdr.indexOf(n);
  if(ix("round")<0||ix("clue")<0||ix("answer")<0)throw new Error("Needs round, category, value, clue, answer columns.");
  const N=blank(),seen={r1:[],r2:[]},filled={r1:{},r2:{}};
  N.r1.dd=[];N.r2.dd=[];N.r1.cats=[];N.r2.cats=[];
  rows.forEach(r=>{
    const g=n=>(r[ix(n)]??"").trim(),rd=g("round").toLowerCase();
    if(rd.startsWith("f")){N.fin={cat:g("category")||N.fin.cat,q:r[ix("clue")]??"",a:r[ix("answer")]??""};return}
    const k=/2/.test(rd)?"r2":"r1",name=g("category");
    let ci=seen[k].indexOf(name);
    if(ci<0){
      if(seen[k].length>=MAXC)return;
      seen[k].push(name);ci=seen[k].length-1;
      N[k].cats.push(mkCat(ci));N[k].cats[ci].name=name;filled[k][ci]={};
    }
    let j=Math.round(+g("value")/RV[k])-1;
    if(!(j>=0&&j<5)||filled[k][ci][j]){
      j=0;while(j<5&&filled[k][ci][j])j++;
      if(j>4)return;
    }
    filled[k][ci][j]=1;
    N[k].cats[ci].clues[j]={q:r[ix("clue")]??"",a:r[ix("answer")]??""};
    if(/^(y|1|t|x|d)/i.test(g("daily_double")))N[k].dd.push(ci+"-"+j);
  });
  ["r1","r2"].forEach(k=>{if(!N[k].cats.length)N[k].cats.push(mkCat(0))});
  return N;
}

/* ======================= HOST CONSOLE ======================= */
let D,S={},U,P={},phase="idle",buzzer=null,out=new Set(),cur=null,dd={},tvAns=false,fin={stage:null};
let started=false,locked=false,tab="r1",round="r1",etab="r1",peer,room,tries=0;
let podium=false,openedAt=0,hostOff=0,tvAt=0,tvBuild="";
let transitionTimer=null,countdownTimer=null,countdownValue=0;

function updTv(){
  const el=$("#tvind");if(!el)return;
  const ok=Date.now()-tvAt<6000,cur_=ok&&tvBuild===BUILD;
  el.textContent=!ok?"● TV window not detected":(cur_?"● TV window connected":"● TV window is out of date, refresh it");
  el.style.color=cur_?"var(--pv)":"var(--poppy)";
}

function podiumPreview(){
  const ps=Object.values(P).sort((a,b)=>b.score-a.score).slice(0,5),rk=[];
  ps.forEach((p,i)=>rk.push(i&&p.score===ps[i-1].score?rk[i-1]:i+1));
  return `<div class="card" style="width:100%;margin-bottom:1rem"><b>Final podium is showing on the TV window.</b>${ps.length?ps.map((p,i)=>`<div>${ordn(rk[i])} &nbsp; ${esc(p.name)} &nbsp; ${money(p.score)}</div>`).join(""):"<div class=\"mute\">No players yet.</div>"}</div>`;
}

function hostLoad(){
  try{D=JSON.parse(localStorage.jdata)}catch(e){}
  D=D||blank();["r1","r2"].forEach(k=>D[k].dd=D[k].dd||[]);
  try{S=JSON.parse(localStorage.jstate)||{}}catch(e){}
  U=S.used||{r1:{},r2:{}};started=!!S.started;
  Object.entries(S.scores||{}).forEach(([n,s])=>P[n]={name:n,score:s,online:false});
}

const saveD=()=>localStorage.jdata=JSON.stringify(D);
const saveS=()=>localStorage.jstate=JSON.stringify({used:U,started,scores:Object.fromEntries(Object.values(P).map(p=>[p.name,p.score]))});

function lockScreen(){
  if(sessionStorage.jok==="1")return hostInit();
  app.innerHTML=`<div class="center"><form class="card" id="lf"><h1>Club Jeopardy</h1>
  <label>Host password<input id="pw" type="password" autocomplete="current-password" autofocus></label>
  <button class="primary" style="width:100%">Unlock host console</button><div id="le" style="color:var(--spirit)"></div>
  <details><summary style="cursor:pointer" class="mute">Make a new password hash</summary><input id="np" placeholder="New password" style="margin:.5rem 0"><button type="button" id="mh" class="ghost">Generate</button><p id="ho" class="url" style="text-align:left;user-select:all"></p></details></form></div>`;
  $("#lf").onsubmit=async e=>{
    e.preventDefault();
    if(await sha($("#pw").value)===PASS_HASH){sessionStorage.jok="1";hostInit()}
    else $("#le").textContent="Wrong password.";
  };
  $("#mh").onclick=async()=>{$("#ho").textContent=$("#np").value?await sha($("#np").value):""};
}

function hostInit(){
  hostLoad();
  app.innerHTML=`<div id="host"><div id="main"></div><aside id="side"></aside></div><div id="ov"></div>`;
  if(bc){
    bc.onmessage=e=>{
      const d=e.data;
      if(d==="hello")sync();
      else if(d&&d.ack){tvAt=Date.now();tvBuild=d.ack;updTv()}
    };
    setInterval(updTv,2000);
  }
  if(!localStorage.jdata){
    fetch("questions.csv",{cache:"no-store"})
      .then(r=>r.ok?r.text():Promise.reject())
      .then(t=>{D=fromCSV(t);saveD();renderMain()})
      .catch(()=>{});
  }
  startRoom();renderSide();renderMain();
}

let hostStatus="Connecting…",rt=null,fbdb,uid,R,L=[],hostReady=false,win=0,buzzSnap={},buzzList=[],settleT=null;
const GRACE_MS=350;
const newCode=()=>Math.random().toString(36).slice(2,7);
const retry=ms=>{clearTimeout(rt);rt=setTimeout(startRoom,ms)};
const byId=id=>Object.values(P).find(p=>p.id===id);
const isMan=p=>!p.id||String(p.id).startsWith("man-");
function setStatus(s){hostStatus=s;if($("#side"))renderSide()}
function lis(ref,evt,cb){ref.on(evt,cb);L.push([ref,evt,cb])}
function detach(){L.forEach(([r,e,c])=>r.off(e,c));L=[];hostReady=false}

async function startRoom(){
  detach();clearTimeout(rt);
  room=localStorage.jroom||(localStorage.jroom=newCode());
  if(!FIREBASE_CONFIG.apiKey){setStatus("Firebase isn't set up yet (see FIREBASE_CONFIG in index.html)");return}
  try{
    setStatus("Connecting…");
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    uid=(await firebase.auth().signInAnonymously()).user.uid;
    fbdb=firebase.database();R=fbdb.ref("rooms/"+room);
    const hu=(await R.child("hostUid").once("value")).val();
    if(hu&&hu!==uid){localStorage.jroom=newCode();return startRoom()}
    if(!hu)await R.child("hostUid").set(uid);
    if((await R.child("hostUid").once("value")).val()!==uid)throw new Error("Couldn't claim the room. Check the database rules were published.");
    const [ps,stt]=await Promise.all([R.child("players").once("value"),R.child("state").once("value")]);
    win=(stt.val()&&stt.val().win)||0;
    Object.entries(ps.val()||{}).forEach(([id,v])=>{
      const p=P[v.name]||(P[v.name]={name:v.name,online:false});
      p.id=id;p.score=v.score||0;
    });
    hostReady=true;
    lis(fbdb.ref(".info/connected"),"value",s=>{
      if(s.val()){
        R.child("hostOnline").onDisconnect().remove();
        R.child("hostOnline").set(true);setStatus("ok");
      }else setStatus("Offline. Reconnecting…");
    });
    lis(fbdb.ref(".info/serverTimeOffset"),"value",s=>{hostOff=s.val()||0});
    lis(R.child("joins"),"child_added",s=>onJoin(s.key,s.val()));
    lis(R.child("joins"),"child_changed",s=>onJoin(s.key,s.val()));
    lis(R.child("presence"),"value",s=>{
      const o=s.val()||{};
      Object.values(P).forEach(p=>{if(p.id&&!isMan(p))p.online=!!o[p.id]});
      renderSide();sync();
    });
    lis(R.child("buzz"),"value",s=>{buzzSnap=s.val()||{};evalBuzz()});
    lis(R.child("wagers"),"value",s=>applyWagers(s.val()||{}));
    lis(R.child("answers"),"value",s=>applyAnswers(s.val()||{}));
    saveS();push();renderSide();
  }catch(e){
    console.warn(e);
    setStatus("Problem: "+(e.code||e.message)+". Retrying…");
    retry(5000);
  }
}

function onJoin(pid,v){
  if(!v||!v.name||byId(pid))return;
  let n=String(v.name).trim().slice(0,16)||"Player",ex=P[n];
  if(ex&&ex.online&&!isMan(ex)){let i=2;while(P[n+i])i++;n+=i;ex=null}
  if(!ex&&locked){R.child("banned/"+pid).set("closed");return}
  const p=ex||(P[n]={name:n,score:0});
  p.id=pid;p.online=true;
  R.child("banned/"+pid).remove();
  saveS();push();renderSide();
}

const wmax=p=>Math.max(Math.abs(p.score),phase==="dd"?DD_FLOOR:FINAL_FLOOR);
const panelBusy=()=>{
  const a=typeof document!=="undefined"&&document.activeElement;
  return !!(a&&a.closest&&a.closest("#panel")&&/^(INPUT|TEXTAREA)$/.test(a.tagName));
};

function applyWagers(o){
  const open=(phase==="final"&&fin.stage==="cat")||(phase==="dd"&&dd.stage==="cat");
  if(!open)return;
  Object.entries(o).forEach(([id,v])=>{
    const p=byId(id);if(!p)return;
    v=Math.floor(+v)||0;p.wager=Math.max(0,Math.min(v,wmax(p)));
  });
  if(!panelBusy())renderPanel();
  sync();
}

function applyAnswers(o){
  if(!((phase==="final"&&fin.stage==="clue")||(phase==="dd"&&dd.stage==="clue")))return;
  Object.entries(o).forEach(([id,v])=>{
    const p=byId(id);if(p)p.fans=String(v).slice(0,200);
  });
  if(!panelBusy())renderPanel();
  sync();
}

function computeBuzz(){
  buzzList=Object.entries(buzzSnap||{})
    .map(([id,v])=>({p:byId(id),v}))
    .filter(x=>x.p&&x.v&&x.v.w===win&&!out.has(x.p.name))
    .map(x=>({name:x.p.name,t:x.v.t}))
    .sort((a,b)=>a.t-b.t);
  buzzList.forEach(b=>{
    b.d=b.t-buzzList[0].t;
    b.r=Math.max(0,b.t-openedAt);
  });
}

function evalBuzz(){
  if(!cur||cur.dd||(phase!=="open"&&phase!=="buzzed"))return;
  computeBuzz();
  if(phase==="open"&&buzzList.length&&!settleT){
    settleT=setTimeout(()=>{
      settleT=null;
      if(phase!=="open")return;
      computeBuzz();
      if(!buzzList.length)return;
      buzzer=buzzList[0].name;phase="buzzed";
      push();renderSide();renderPanel();
    },GRACE_MS);
  }
  renderPanel();sync();
}

function clearRound(all){
  clearTimeout(settleT);settleT=null;buzzSnap={};buzzList=[];
  if(hostReady){
    R.child("buzz").remove();
    if(all){R.child("wagers").remove();R.child("answers").remove()}
  }
}

function clearClueTimers(){
  clearTimeout(transitionTimer);transitionTimer=null;
  clearTimeout(countdownTimer);countdownTimer=null;
  countdownValue=0;
}

/* Start the three-second countdown after the wrong-answer animation.
   Buzzers remain closed until the host changes phase to "open". */
function startCountdown(){
  if(!cur||phase!=="wrong")return;
  clearTimeout(countdownTimer);countdownTimer=null;
  phase="countdown";buzzer=null;countdownValue=3;
  clearRound();
  push();renderSide();renderPanel();
  countdownTimer=setTimeout(countdownTick,1000);
}

function countdownTick(){
  if(!cur||phase!=="countdown")return;
  if(countdownValue<=1){
    countdownTimer=null;
    countdownValue=0;
    /* Remove any attempt sent by a stale client before reopening. */
    clearRound();
    win++;
    openedAt=Date.now()+hostOff;
    phase="open";
    push();renderSide();renderPanel();
    return;
  }
  countdownValue--;
  push();renderPanel();
  countdownTimer=setTimeout(countdownTick,1000);
}

function push(){
  if(hostReady){
    R.child("state").set({
      phase,win,buzzer:buzzer||null,out:[...out],countdown:countdownValue,
      fin:fin.stage||null,cat:D.fin.cat,q:fin.stage==="clue"?D.fin.q:"",
      dd:phase==="dd"&&cur?{
        stage:dd.stage,cat:D[cur.r].cats[cur.c].name,
        q:dd.stage==="clue"?D[cur.r].cats[cur.c].clues[cur.j].q:""
      }:null
    }).catch(e=>console.warn(e));
    const o={};
    Object.values(P).forEach(p=>{
      if(p.id)o[p.id]={name:p.name,score:p.score};
    });
    R.child("players").set(o).catch(e=>console.warn(e));
  }
  sync();
}

/* ----- TV synchronization ----- */
function joinUrl(){return location.origin+location.pathname+"?room="+room}

function tvState(){
  const ps=Object.values(P).sort((a,b)=>b.score-a.score),RR=D[round];
  const cat=cur&&D[cur.r].cats[cur.c],cl=cur&&cat.clues[cur.j],val=cur?RV[cur.r]*(cur.j+1):0;
  const online=ps.filter(p=>p.online);
  return {
    started,url:joinUrl(),names:ps.map(p=>p.name),
    round,rname:round==="r1"?"Round 1":"Round 2",
    cats:RR.cats.map(c=>c.name),used:U[round],
    vals:[1,2,3,4,5].map(j=>RV[round]*j),
    top:ps.slice(0,5).map(p=>({n:p.name,s:p.score})),
    more:Math.max(0,ps.length-5),phase,buzzer,podium,
    countdown:countdownValue,
    runners:phase==="buzzed"?buzzList.slice(1,2).map(b=>({n:b.name,d:b.d})):[],
    cur:cur&&Object.assign({
      cat:cat.name,val,dd:cur.dd,ddStage:cur.dd?dd.stage:null,
      q:(cur.dd&&dd.stage==="cat")?"":cl.q,
      a:cur.dd?(dd.stage==="reveal"?cl.a:""):(tvAns||phase==="correct"||phase==="answer"?cl.a:"")
    },cur.dd?{
      nw:online.filter(p=>p.wager!=null).length,
      na:online.filter(p=>p.fans!=null).length,
      no:online.length,
      rows:dd.stage==="reveal"?ps.map(p=>({n:p.name,a:p.fans||"",w:p.wager||0,r:p.result||""})):[]
    }:{}),
    fin:phase==="final"?{
      stage:fin.stage,cat:D.fin.cat,q:fin.stage!=="cat"?D.fin.q:"",a:fin.stage==="reveal"?D.fin.a:"",
      nw:online.filter(p=>p.wager!=null).length,
      na:online.filter(p=>p.fans!=null).length,
      no:online.length,
      rows:fin.stage==="reveal"?ps.map(p=>({n:p.name,a:p.fans||"",w:p.wager||0,r:p.result||""})):[]
    }:null
  };
}

function sync(){if(bc)bc.postMessage(tvState())}

/* ----- sidebar: QR + players ----- */
function drawQR(el,size){
  el.innerHTML="";
  new QRCode(el,{text:joinUrl(),width:size,height:size});
}

function renderSide(){
  const ps=Object.values(P);
  $("#side").innerHTML=`<h2 style="font-size:1.4rem">Join on your phone</h2>
  <div id="qrbox" title="Click to enlarge"></div><div class="url">${esc(joinUrl())}</div>

  ${ps.length?"":'<p class="mute">Nobody yet. Scan the code.</p>'}
  ${ps.sort((a,b)=>b.score-a.score).map(p=>`<div class="pl ${phase==="buzzed"&&buzzer===p.name?"hot":""}"><span class="dot ${p.online?"":"off"}"></span><span class="n ${p.online?"":"off"}">${esc(p.name)}</span>
  <button class="s" data-sc="${esc(p.name)}" title="Edit score">${p.score}</button><button data-rn="${esc(p.name)}" aria-label="Rename ${esc(p.name)}" title="Rename">✎</button><button data-rm="${esc(p.name)}" aria-label="Remove ${esc(p.name)}" title="Remove from lobby">×</button></div>`).join("")}
  <button class="ghost" id="ng" style="margin-top:1rem;width:100%">New game (reset scores and board)</button>`;
  drawQR($("#qrbox"),170);
  $("#qrbox").onclick=()=>{
    $("#ov").innerHTML=`<div style="position:fixed;inset:0;background:#fff;color:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem"><div id="bq"></div><h2 style="font-size:2rem">Scan to join</h2><button class="primary" id="cq">Close</button></div>`;
    drawQR($("#bq"),Math.min(innerHeight*.6,innerWidth*.8));
    $("#cq").onclick=()=>$("#ov").innerHTML="";
  };

  const each=(a,f)=>$("#side").querySelectorAll(a).forEach(f);

  each("[data-sc]",b=>b.onclick=()=>{
    const n=b.dataset.sc,v=prompt("Score for "+n,P[n].score);

      P[n].score=+v;saveS();push();renderSide();
    }
  });

  each("[data-rn]",b=>b.onclick=()=>{
    const o=b.dataset.rn,n=(prompt("New name for "+o,o)||"").trim().slice(0,16);
    if(!n||n===o||P[n])return;
    const p=P[o];
    /* Preserve all active round data when the displayed name changes. */
    const savedWager=p.wager,savedAnswer=p.fans,savedResult=p.result;
    delete P[o];
    p.name=n;
    if(savedWager!==undefined)p.wager=savedWager;
    if(savedAnswer!==undefined)p.fans=savedAnswer;
    if(savedResult!==undefined)p.result=savedResult;
    P[n]=p;
    if(buzzer===o)buzzer=n;
    if(out.has(o)){out.delete(o);out.add(n)}
    if(hostReady&&p.id&&!isMan(p)){
      R.child("joins/"+p.id+"/name").set(n).catch(e=>console.warn(e));
    }
    saveS();push();renderSide();renderPanel();
  });

  each("[data-rm]",b=>b.onclick=()=>{
    if(confirm("Remove "+b.dataset.rm+" from the lobby?"))kick(b.dataset.rm);
  });

  $("#ap").onclick=()=>{
    const n=(prompt("Player or team name")||"").trim().slice(0,16);
    if(n&&!P[n]){
      P[n]={id:"man-"+Math.random().toString(36).slice(2,8),name:n,score:0,online:false};
      saveS();push();renderSide();
    }
  };

  $("#rc").onclick=()=>{startRoom();toast("Reconnecting the room…")};

  $("#nr").onclick=async()=>{
    if(!confirm("Create a new room code? Everyone connected is disconnected and must scan the new QR code."))return;
    try{if(hostReady)await R.child("state").set({phase:"closed",win:win+1})}catch(e){}
    clearClueTimers();detach();P={};phase="idle";cur=null;buzzer=null;fin={stage:null};out=new Set();
    localStorage.jroom=newCode();saveS();renderMain();startRoom();
    toast("New room code: "+localStorage.jroom);
  };

  $("#lk").onclick=()=>{locked=!locked;renderSide()};

  $("#ro").onclick=()=>{
    const off=ps.filter(p=>!p.online);
    if(off.length&&confirm("Remove "+off.length+" offline player(s)? Their scores are lost."))off.forEach(p=>kick(p.name));
  };

  $("#ng").onclick=()=>{
    if(confirm("Reset all scores and used clues?")){
      clearClueTimers();
      U={r1:{},r2:{}};
      Object.values(P).forEach(p=>{p.score=0;delete p.wager;delete p.fans;delete p.result});
      phase="idle";fin={stage:null};cur=null;started=false;podium=false;
      clearRound(true);saveS();push();renderSide();renderMain();
      toast("Game reset: scores zeroed, board cleared");
    }
  };
  sync();
}

function kick(n){
  const p=P[n];if(!p)return;
  if(hostReady&&p.id&&!String(p.id).startsWith("man-")){
    R.child("banned/"+p.id).set("removed");
    R.child("joins/"+p.id).remove();
  }
  delete P[n];
  if(buzzer===n){buzzer=null;if(phase==="buzzed")phase="open"}
  saveS();push();renderSide();renderPanel();
}

/* ----- main: tabs, board, editor ----- */
function renderMain(){
  const m=$("#main"),tabs=[["r1","Round 1"],["r2","Round 2"],["fin","Final Jeopardy"],["edit","Editor"]];
  m.innerHTML=`<div class="bar">${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}<span class="sp"></span>
  <span id="tvind" class="mute"></span><button class="ghost" id="pb">${podium?"Hide podium":"Show final podium"}</button><button class="ghost" id="tvb">Open TV display</button><button class="${started?"ghost":"primary"}" id="gb">${started?"Back to lobby screen":"Start game"}</button></div>${FIREBASE_CONFIG.apiKey?"":`<div class="card" style="width:100%;margin-bottom:1rem"><b>Firebase isn't set up yet.</b> Phones can't join until you paste your Firebase config into <code>FIREBASE_CONFIG</code> near the top of index.html and commit it.</div>`}${podium?podiumPreview():""}<div id="panel"></div><div id="body"></div>`;
  const b=$("#body");

      [0,1,2,3,4].map(j=>RR.cats.map((c,i)=>{
        const u=U[tab][i+"-"+j],star=RR.dd.includes(i+"-"+j);
        return `<button class="tile ${u?"used":""}" data-c="${i}" data-j="${j}" ${u?"disabled":""}>$${RV[tab]*(j+1)}${star&&!u?'<span class="star" title="Daily Double (host only)">★</span>':""}</button>`;
      }).join("")).join("")}</div>

  }else if(tab==="fin"){
    b.innerHTML=`<div class="card" style="width:min(560px,100%)"><h1>Final Jeopardy</h1><p>Category: <b>${esc(D.fin.cat)}</b></p><p class="mute">Players set a wager on their phones, then type an answer. You mark each one right or wrong.</p><button class="primary" id="sf">Start Final Jeopardy</button></div>`;
  }else{
    b.innerHTML=editorHTML();bindEditor();
  }

  m.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{

  });

  $("#tvb").onclick=()=>{
    const w=window.open(location.pathname+"?tv","jeopardy-tv","popup,width=1280,height=720");
    if(w){try{w.focus()}catch(e){}}
  };
  $("#pb").onclick=()=>{podium=!podium;renderMain()};
  $("#gb").onclick=()=>{started=!started;saveS();renderMain()};

  if($("#sf"))$("#sf").onclick=()=>{
    Object.values(P).forEach(p=>{delete p.wager;delete p.fans;delete p.result});
    started=true;saveS();phase="final";fin={stage:"cat"};cur=null;
    clearRound(true);push();renderMain();
  };

  renderPanel();sync();updTv();
}

function openClue(c,j){
  clearClueTimers();
  cur={r:tab,c,j,dd:D[tab].dd.includes(c+"-"+j)};
  round=tab;tvAns=false;buzzer=null;out=new Set();dd={stage:"cat"};
  clearRound(true);
  if(cur.dd)Object.values(P).forEach(p=>{delete p.wager;delete p.fans;delete p.result});
  phase=cur.dd?"dd":"locked";
  started=true;podium=false;saveS();push();renderPanel();renderMain();
}

function closeClue(used){
  clearClueTimers();
  if(used&&cur)U[cur.r][cur.c+"-"+cur.j]=1;
  const wasDD=!!(cur&&cur.dd);
  if(wasDD)Object.values(P).forEach(p=>{delete p.wager;delete p.fans;delete p.result});
  cur=null;phase="idle";buzzer=null;tvAns=false;clearRound(wasDD);saveS();push();renderSide();renderMain();
}

/* Keep the clue on the TV until the host explicitly advances. */
function showClueAnswer(markUsed=true){
  clearClueTimers();
  if(!cur)return;
  if(markUsed)U[cur.r][cur.c+"-"+cur.j]=1;
  tvAns=true;buzzer=null;phase="answer";countdownValue=0;
  saveS();push();renderSide();renderPanel();
}

const curVal=()=>RV[cur.r]*(cur.j+1);

/* Correct and incorrect answers use the same 1.5-second transition.
   Incorrect answers then return to the same clue for a three-second countdown. */
function judge(name,ok){
  const p=P[name];
  if(!p||!cur||cur.dd||["correct","wrong","countdown","answer"].includes(phase))return;

  const value=curVal();
  clearClueTimers();

  if(ok){
    p.score+=value;
    phase="correct";buzzer=name;countdownValue=0;
    clearRound();saveS();push();renderSide();renderPanel();
    transitionTimer=setTimeout(()=>{
      transitionTimer=null;
      if(cur&&phase==="correct")showClueAnswer(true);
    },1500);
    return;
  }

  p.score-=value;
  out.add(name);
  buzzer=name;
  tvAns=false;
  phase="wrong";
  countdownValue=0;
  clearRound();
  saveS();push();renderSide();renderPanel();

  transitionTimer=setTimeout(()=>{
    transitionTimer=null;
    startCountdown();
  },1500);
}

function renderPanel(){
  const el=$("#panel");if(!el)return;
  if(phase==="final"||(cur&&cur.dd))return panelGroup(el);
  if(!cur){el.innerHTML="";return}

  const cat=D[cur.r].cats[cur.c],cl=cat.clues[cur.j],val=curVal(),ps=Object.values(P);
  const head=`<div class="ph"><span>${fmt(cat.name)} · $${val}</span>${cur.dd?'<span class="badge">Daily Double</span>':""}</div><div class="pq">${fmt(cl.q)}</div><div class="pa">Answer (host only): ${fmt(cl.a)}</div>`;
  const foot=["correct","answer"].includes(phase)?"":`<div class="ctl"><button class="ghost" id="sa">${tvAns?"Hide answer on TV":"Show answer on TV"}</button><button class="ghost" id="done">Done (mark used)</button><button class="ghost" id="back">Back (keep unused)</button></div>`;
  let mid="";

  if(phase==="locked")mid=`<div class="ctl"><button class="primary" id="ob">Open buzzers</button></div>`;
  if(phase==="open")mid=`<div class="ctl"><span>Buzzers open…</span><button id="lb">Lock buzzers</button></div>`;

  on("#no",()=>judge(buzzer,false));

  on("#sa",()=>{tvAns=!tvAns;renderPanel();sync()});

  on("#back",()=>closeClue(false));
}

function panelGroup(el){
  const isF=phase==="final",G=isF?fin:dd,ps=Object.values(P).sort((a,b)=>b.score-a.score);
  let cname,q,a;
  if(isF){cname=D.fin.cat;q=D.fin.q;a=D.fin.a}
  else{const c=D[cur.r].cats[cur.c],cl=c.clues[cur.j];cname=c.name;q=cl.q;a=cl.a}

  let body="",ctl="";
  if(G.stage==="cat"){

  }

  if(G.stage==="clue"){

  }

  if(G.stage==="reveal"){
    body=`<div class="pa">Answer: ${fmt(a)}</div><table><tr><th>Player</th><th>Answer</th><th>Wager</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.name)} (${money(p.score)})</td><td>${esc(p.fans||"(none)")}</td><td>$${p.wager||0}</td><td>${p.result?(p.result==="ok"?"✓ scored":"✗ scored"):`<button class="ok" data-r="${esc(p.name)}" data-v="1">✓</button> <button class="bad" data-r="${esc(p.name)}" data-v="-1">✗</button>`}</td></tr>`).join("")}</table>`;
    if(!isF)ctl=`<button class="primary" id="done">Done (mark used)</button>`;
  }

  ctl+=isF?`<button class="ghost" id="fx">Close final</button>`:`<button class="ghost" id="back">Back (keep unused)</button>`;
  el.innerHTML=`<div class="ph"><span>${isF?"Final Jeopardy":"Daily Double · $"+curVal()}</span>${isF?"":'<span class="badge">everyone plays</span>'}</div>${body}<div class="ctl">${ctl}</div>`;

  const on=(id,fn)=>$(id)&&($(id).onclick=fn);
  on("#n1",()=>{G.stage="clue";push();renderPanel()});
  on("#n2",()=>{G.stage="reveal";push();renderPanel()});
  on("#fx",()=>{phase="idle";fin={stage:null};push();renderPanel()});
  on("#done",()=>closeClue(true));
  on("#back",()=>closeClue(false));

  el.querySelectorAll("[data-wg]").forEach(x=>x.onchange=()=>{
    const p=P[x.dataset.wg];if(!p)return;
    p.wager=Math.max(0,Math.min(Math.floor(+x.value)||0,wmax(p)));
    x.value=p.wager;push();
  });

  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const p=P[b.dataset.r],v=+b.dataset.v;
    p.score+=v*(p.wager||0);p.result=v>0?"ok":"no";
    saveS();renderSide();push();renderPanel();
  });
}

function removeCat(k,i){
  const RR=D[k];
  if(RR.cats.length<=1){alert("A board needs at least one category.");return}
  if(!confirm('Remove category "'+RR.cats[i].name+'" and its clues?'))return;
  RR.cats.splice(i,1);
  const mp=s=>{
    const [c,j]=s.split("-").map(Number);
    return c===i?null:(c>i?(c-1)+"-"+j:s);
  };
  RR.dd=RR.dd.map(mp).filter(Boolean);
  const nu={};
  Object.keys(U[k]).forEach(s=>{const m=mp(s);if(m)nu[m]=1});
  U[k]=nu;saveD();saveS();renderMain();
}

function setCols(k,n){
  const RR=D[k];n=Math.max(1,Math.min(MAXC,Math.floor(n)||RR.cats.length));
  if(n<RR.cats.length){
    const d=RR.cats.length-n;
    if(!confirm("Remove the last "+d+" categor"+(d>1?"ies":"y")+" and their clues?")){renderMain();return}
    RR.cats.length=n;RR.dd=RR.dd.filter(s=>+s.split("-")[0]<n);
    const nu={};
    Object.keys(U[k]).forEach(s=>{if(+s.split("-")[0]<n)nu[s]=1});
    U[k]=nu;saveS();
  }
  while(RR.cats.length<n)RR.cats.push(mkCat(RR.cats.length));
  saveD();renderMain();
}

function bindEditor(){
  const b=$("#body");let lastF=null;
  const showPv=()=>{
    const p=$("#fpv");
    if(p&&lastF)p.innerHTML=lastF.value?fmt(lastF.value):'<span class="mute">(empty)</span>';
  };
  const wrap=mk=>{
    const el=lastF;if(!el)return;
    const s=el.selectionStart,e=el.selectionEnd,v=el.value,sel=v.slice(s,e);
    el.value=v.slice(0,s)+mk+sel+mk+v.slice(e);el.focus();
    if(sel)el.setSelectionRange(s+mk.length,e+mk.length);
    else el.setSelectionRange(s+mk.length,s+mk.length);
    el.dispatchEvent(new Event("input",{bubbles:true}));showPv();
  };

  b.addEventListener("focusin",e=>{
    if(e.target.matches&&e.target.matches("textarea,input[data-k]")){lastF=e.target;showPv()}
  });
  b.addEventListener("input",e=>{if(e.target===lastF)showPv()});
  b.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&lastF&&e.target===lastF){
      const mk={b:"**",i:"*",u:"__"}[e.key.toLowerCase()];
      if(mk){e.preventDefault();wrap(mk)}
    }
  });
  b.querySelectorAll("[data-mk]").forEach(x=>{
    x.onmousedown=e=>e.preventDefault();
    x.onclick=()=>wrap(x.dataset.mk);
  });

  b.oninput=e=>{
    const d=e.target.dataset;if(!d.k)return;
    if(d.k==="fin")D.fin[d.f]=e.target.value;
    else if(d.f==="name")D[d.k].cats[+d.c].name=e.target.value;
    else D[d.k].cats[+d.c].clues[+d.j][d.f]=e.target.value;
    saveD();sync();
  };

  if($("#nc"))$("#nc").onchange=e=>setCols(etab,+e.target.value);
  if($("#ac"))$("#ac").onclick=()=>{
    const a=D[etab].cats;
    if(a.length<MAXC){a.push(mkCat(a.length));saveD();renderMain()}
  };
  b.querySelectorAll("[data-rc]").forEach(x=>x.onclick=()=>removeCat(etab,+x.dataset.rc));
  b.querySelectorAll("[data-et]").forEach(x=>x.onclick=()=>{etab=x.dataset.et;renderMain()});
  b.querySelectorAll("[data-dd]").forEach(x=>x.onclick=()=>{
    const a=D[etab].dd,v=x.dataset.dd,i=a.indexOf(v);
    i<0?a.push(v):a.splice(i,1);
    x.classList.toggle("on",i<0);x.setAttribute("aria-pressed",i<0);saveD();
  });

  $("#ex").onclick=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([toCSV(D)],{type:"text/csv"}));
    a.download="questions.csv";a.click();
  };
  $("#im").onclick=()=>$("#fi").click();
  $("#fi").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const N=fromCSV(await f.text());
      if(confirm("Replace all current questions with this file?")){D=N;saveD();renderMain()}
    }catch(x){alert("Couldn't read that CSV. "+x.message)}
    e.target.value="";
  };
  $("#lq").onclick=()=>fetch("questions.csv",{cache:"no-store"})
    .then(r=>r.ok?r.text():Promise.reject())
    .then(t=>{
      if(confirm("Replace all current questions with questions.csv from the site?")){D=fromCSV(t);saveD();renderMain()}
    })
    .catch(()=>alert("No questions.csv found next to index.html."));
}

function playerMode(code){
  const card=(t,p,btn,fn)=>{
    app.innerHTML=`<div class="center"><div class="card"><h1>${t}</h1><p>${p}</p>${btn?`<button class="primary" id="rb">${btn}</button>`:""}</div></div>`;
    if(btn)$("#rb").onclick=fn;
  };
  if(!FIREBASE_CONFIG.apiKey)return card("Game not set up","The host hasn't finished setting up this site yet.");

  let name=localStorage.jname||"",uid,R,db,S={phase:"idle"},me=null,ban=null,hostOn=true,myW=null,myA=null,off=0,sent=-1,attached=false;
  const TS=()=>firebase.database.ServerValue.TIMESTAMP;

  const wagerForm=(max,w,note)=>`${note||""}<form id="wf"><label>Your wager (0–${max})<input id="wv" type="number" min="0" max="${max}" inputmode="numeric" value="${w??""}" required></label><button class="primary" style="width:100%;margin-top:.6rem">Lock in wager</button></form>${w!=null?`<p>Wager set: $${w}</p>`:""}`;

  const ui=()=>{
    if(!R)return;
    const kA=$("#av")&&$("#av").value,kW=$("#wv")&&$("#wv").value;

    if(ban)return card(ban==="removed"?"You were removed":"Lobby is closed",ban==="removed"?"The host removed you from the game.":"The host isn't accepting new players right now.","Try joining again",()=>R.child("joins/"+uid).set({name,ts:TS()}));
    if(S.phase==="closed")return card("Room closed","The host started a new room. Scan the new QR code to join.");
    if(!me)return card("Joining…",hostOn?"Waiting for the host to let you in.":"The host page doesn't look like it's open yet. Hang tight.");
    if(me.name!==name){name=me.name;localStorage.jname=name}

    const score=me.score||0,top=`<div id="pinfo"><span>${esc(me.name)}</span><span>${money(score)}</span></div>`,warn=hostOn?"":`<div class="mute" style="text-align:center">The host looks offline…</div>`;
    let s=S.phase;const outList=S.out||[];
    if(s==="open"&&outList.includes(me.name))s="out";
    if(s==="buzzed"&&S.buzzer===me.name)s="you";

    if(s==="final"||s==="dd"){
      const isF=s==="final",d=S.dd||{},stage=isF?S.fin:d.stage,cat=isF?S.cat:d.cat,q=isF?S.q:d.q;
      const max=Math.max(Math.abs(score),isF?FINAL_FLOOR:DD_FLOOR);
      const note=score<0?`<p class="mute">You're at ${money(score)}, so you can wager up to ${money(max)}. A correct answer brings you back to $0.</p>`:"";
      const body=`<h1>${isF?"Final Jeopardy":"Daily Double"}</h1><p><b>${fmt(cat)}</b></p>`+
        (stage==="cat"?(isF?"":`<p class="mute">Everyone plays this one!</p>`)+wagerForm(max,myW,note):"")+
        (stage==="clue"?`<p>${fmt(q)}</p><form id="af"><label>Your answer<input id="av" value="${esc(myA||"")}" maxlength="200" required></label><button class="primary" style="width:100%;margin-top:.6rem">Submit answer</button></form>${myA!=null?"<p>Submitted.</p>":""}`:"")+
        (stage==="reveal"?"<p>Watch the main screen.</p>":"");
      app.innerHTML=`<div id="player">${top}<div class="card" style="width:100%;max-width:none">${body}</div>${warn}</div>`;
      if($("#wv")&&kW)$("#wv").value=kW;
      if($("#av")&&kA)$("#av").value=kA;
      if($("#wf"))$("#wf").onsubmit=e=>{
        e.preventDefault();
        R.child("wagers/"+uid).set(Math.min(max,Math.max(0,Math.floor(+$("#wv").value)||0)));
      };
      if($("#af"))$("#af").onsubmit=e=>{
        e.preventDefault();
        R.child("answers/"+uid).set($("#av").value.slice(0,200));
      };
      return;
    }

    const mine=s==="open"&&sent===S.win;
    const L={idle:"WAIT",locked:"WAIT",open:mine?"SENT":"BUZZ!",out:"OUT",buzzed:"WAIT",you:"YOU!",wrong:"WAIT",correct:"WAIT",answer:"WAIT",countdown:"WAIT"};
    const msg={
      idle:"Waiting for the next clue",
      locked:"Hold on. Buzzers open soon.",
      open:mine?"Locked in. Waiting for the result…":"",
      out:"Locked out for this clue",
      buzzed:S.buzzer?esc(S.buzzer)+" buzzed in":"",
      you:"You buzzed in first. Answer out loud!",
      wrong:"Incorrect answer. Wait for the next buzz.",
      correct:"Correct! The answer is shown on the main screen.",
      answer:"Answer revealed on the main screen.",
      countdown:`Buzzers reopen in ${S.countdown||1}…`
    }[s]||"";

    app.innerHTML=`<div id="player">${top}<button id="buzz" class="${s}" ${s==="open"&&!mine?"":"disabled"}>${L[s]||"WAIT"}</button><div id="pmsg">${msg}</div>${warn}</div>`;
    if(s==="open"&&!mine)$("#buzz").onpointerdown=e=>{
      e.preventDefault();
      if(sent===S.win)return;
      sent=S.win;
      R.child("buzz/"+uid).set({w:S.win,t:Date.now()+off}).catch(()=>{sent=-1;ui()});
      if(navigator.vibrate)navigator.vibrate(60);
      ui();
    };
  };

  const join=()=>{
    app.innerHTML=`<div class="center"><form class="card" id="jf"><h1>Join the game</h1><label>Your name<input id="nm" maxlength="16" value="${esc(name)}" autofocus autocomplete="nickname"></label><button class="primary" style="width:100%">Join</button></form></div>`;
    $("#jf").onsubmit=e=>{
      e.preventDefault();name=$("#nm").value.trim();if(!name)return;
      localStorage.jname=name;start();
    };
  };

  const start=async()=>{
    card("Connecting…","");
    try{
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      uid=(await firebase.auth().signInAnonymously()).user.uid;
      db=firebase.database();R=db.ref("rooms/"+code);
      if(!(await R.child("hostUid").once("value")).exists())return card("Room not found","Looking for room <b>"+esc(code)+"</b>. Make sure the host console is open and unlocked, with “Room online” showing, and that you scanned its current QR code.","Try again",start);
      if(!attached){
        attached=true;
        db.ref(".info/serverTimeOffset").on("value",s=>off=s.val()||0);
        db.ref(".info/connected").on("value",s=>{
          if(s.val()){
            const pr=R.child("presence/"+uid);
            pr.onDisconnect().remove();pr.set(true);
          }
        });
        R.child("state").on("value",s=>{S=s.val()||{phase:"idle"};ui()});
        R.child("players/"+uid).on("value",s=>{me=s.val();ui()});
        R.child("banned/"+uid).on("value",s=>{ban=s.val();ui()});
        R.child("hostOnline").on("value",s=>{hostOn=!!s.val();ui()});
        R.child("wagers/"+uid).on("value",s=>{myW=s.val();ui()});
        R.child("answers/"+uid).on("value",s=>{myA=s.val();ui()});
      }
      await R.child("joins/"+uid).set({name,ts:TS()});
      ui();
    }catch(e){
      card("Can't connect",esc(e.code||e.message||"Unknown error"),"Try again",start);
    }
  };

  name?start():join();
}

/* ======================= ROUTER (must stay last) ======================= */
const qs=new URLSearchParams(location.search);
if(qs.get("room"))playerMode(qs.get("room"));
else if(qs.has("tv"))tvMode();
else lockScreen();
</script>
</body>
</html>
