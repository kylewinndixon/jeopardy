<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Jeopardy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Stanford palette: identity.stanford.edu/design-elements/color */
:root{--cardinal:#8C1515;--cardinal-dk:#820000;--cardinal-lt:#B83A4B;--black:#2E2D29;--b90:#43423E;--b80:#585754;--b70:#6D6C69;
--fog:#DAD7CB;--fogl:#F4F4F4;--pa:#175E54;--pv:#279989;--poppy:#E98300;--illum:#FEDD5C;--spirit:#E04F39;--brick:#651C32;--sky:#67AFD2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--fogl);font:16px/1.45 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Source Serif 4",Georgia,serif;font-weight:700;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:.55em 1em;background:var(--b80);font-weight:600}
button:hover:not(:disabled){filter:brightness(1.15)}
:focus-visible{outline:3px solid var(--illum);outline-offset:2px}
button.primary{background:var(--cardinal);box-shadow:inset 0 0 0 1px var(--cardinal-lt)}
button.ok{background:var(--pa)}button.bad{background:var(--brick)}button.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--b70)}
button.on{background:var(--fog);color:var(--black)}
input,textarea,select{background:var(--b90);border:1px solid var(--b70);border-radius:6px;padding:.5em .6em;width:100%}
textarea{resize:vertical;min-height:3.2em}
.hide{display:none!important}.mute{color:var(--fog);opacity:.75}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:var(--b90);border-top:4px solid var(--cardinal);border-radius:8px;padding:1.5rem;width:min(440px,100%)}
.card h1{font-size:2rem;margin-bottom:.8rem}.card>*+*{margin-top:.8rem}
/* host console */
#host{display:grid;grid-template-columns:1fr 310px;min-height:100vh}
@media(max-width:950px){#host{grid-template-columns:1fr}}
#main{padding:1rem;min-width:0}
#side{padding:1rem;background:#242320;border-left:3px solid var(--cardinal)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}.bar .sp{flex:1}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cat{display:grid;place-items:center;text-align:center;background:var(--fog);color:var(--black);min-height:62px;padding:.3rem;font:700 .95rem/1.1 "Source Serif 4",serif;border-radius:3px}
.tile{position:relative;min-height:54px;background:var(--cardinal);color:var(--illum);font:700 1.5rem "Source Serif 4",serif;border-radius:3px;padding:0}
.tile.used{background:var(--b90);color:transparent;cursor:default}
.tile .star{position:absolute;top:2px;right:6px;font-size:.8rem;color:var(--poppy)}
#qrbox{background:#fff;padding:8px;border-radius:8px;width:max-content;margin:.5rem auto;cursor:zoom-in}
.url{font-size:.8rem;opacity:.7;word-break:break-all;text-align:center}
.pl{display:flex;align-items:center;gap:.3rem;padding:.35rem .2rem;border-bottom:1px solid var(--b90)}
.pl.hot{background:var(--pa);border-radius:6px}
.pl .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl .n.off{opacity:.55}
.pl button{padding:.2em .5em;background:transparent}
.pl .s{box-shadow:inset 0 0 0 1px var(--b70);min-width:4.2em;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--illum);color:var(--black);padding:.6em 1.2em;border-radius:8px;font-weight:700;z-index:30;box-shadow:0 4px 16px #0008}
.stat{text-align:center;font-weight:600;margin:.3rem 0}.stat.good{color:var(--pv)}.stat.warn{color:var(--poppy)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pv);flex:none}.dot.off{background:var(--b70)}
.mini{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}.mini button{padding:.3em .7em;font-size:.85rem}
#panel:not(:empty){background:var(--b90);border-left:6px solid var(--cardinal);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1rem}
.ph{display:flex;gap:.6rem;align-items:center;font-weight:700;margin-bottom:.4rem}
.badge{background:var(--poppy);color:var(--black);border-radius:4px;padding:.05em .5em;font-size:.85rem}
.pq{font:600 1.35rem/1.3 "Source Serif 4",serif;margin:.3rem 0}
.pa{color:var(--illum);margin-bottom:.6rem}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.who{font:700 1.4rem "Source Serif 4",serif;background:var(--illum);color:var(--black);padding:.1em .6em;border-radius:6px}
.ctl select{width:auto}.ctl input[type=number]{width:7em}
table{border-collapse:collapse;margin-top:.6rem}td,th{padding:.35rem .8rem;text-align:left;border-bottom:1px solid var(--b80)}
/* editor */
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.ed .c{background:var(--b90);border-top:3px solid var(--cardinal);border-radius:8px;padding:.8rem}.ed .c>*+*{margin-top:.4rem}
.ed input.nm{font:700 1rem "Source Serif 4",serif;color:var(--illum)}
.ed label{font-size:.85rem;opacity:.8}
.lrow{display:flex;justify-content:space-between;align-items:center}
button.dd{padding:.15em .6em;font-size:.8rem;background:transparent;box-shadow:inset 0 0 0 1px var(--b70)}
button.dd.on{background:var(--poppy);color:var(--black);box-shadow:none}
/* player */
#player{min-height:100vh;display:flex;flex-direction:column;padding:1rem;gap:1rem}
#buzz{flex:1;min-height:55vh;border-radius:24px;font:700 clamp(3rem,16vw,7rem) "Source Serif 4",serif;background:var(--b80);color:var(--fog);touch-action:manipulation}
#buzz.open{background:var(--pv);color:var(--black);box-shadow:0 12px 0 var(--pa)}
#buzz.open:active{transform:translateY(8px);box-shadow:0 4px 0 var(--pa)}
#buzz.out{background:var(--brick);color:var(--fog)}#buzz.you{background:var(--illum);color:var(--black)}
#pinfo{display:flex;justify-content:space-between;font:700 1.3rem "Source Serif 4",serif}
#pmsg{text-align:center;font-size:1.2rem;min-height:1.6em}
/* TV */
#tv{height:100vh;display:grid;grid-template-rows:1fr auto;overflow:hidden;cursor:none;background:var(--black)}
.tvmain{padding:2.2vh 2vw 1.2vh;min-height:0;display:flex;flex-direction:column}
.tvhead{font:600 min(2.2vw,3.6vh) "Source Serif 4",serif;color:var(--fog);margin-bottom:1.2vh;letter-spacing:.02em}
.tvboard{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:auto repeat(5,1fr);gap:.9vh .6vw;min-height:0}
.tvcat{display:grid;place-items:center;text-align:center;background:var(--fog);color:var(--black);padding:1.2vh .5vw;font:700 min(2.1vw,3.8vh)/1.1 "Source Serif 4",serif;border-radius:.4vh}
.tvtile{display:grid;place-items:center;background:var(--cardinal);color:var(--illum);font:700 min(5vw,9vh) "Source Serif 4",serif;border-radius:.4vh}
.tvtile.used{background:#3a3935;color:transparent}
.tvbar{display:flex;align-items:center;gap:1.2vw;padding:1.4vh 2vw;background:#1f1e1b;border-top:.6vh solid var(--cardinal);min-height:16vh}
.chip{flex:1;min-width:0;background:var(--b90);border-radius:.8vh;padding:1.2vh 1vw;text-align:center}
.chip.lead{background:var(--illum);color:var(--black)}
.cn{display:block;font:600 min(1.7vw,3vh) "Source Sans 3",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{display:block;font:700 min(3vw,5.5vh) "Source Serif 4",serif}
.chip.empty{background:none;opacity:.6;font-size:min(1.8vw,3vh)}
.more{font:600 min(1.6vw,2.8vh) "Source Sans 3";opacity:.7}
#tvqr{background:#fff;padding:.7vh;border-radius:.6vh;line-height:0;flex:none}
.tvclue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:0 4vw}
.tvclue .meta{font:600 min(2.4vw,4vh) "Source Serif 4",serif;color:var(--illum)}
.tvclue .q{font:600 min(4.6vw,8vh)/1.25 "Source Serif 4",serif;max-width:88vw}
.tvclue .a{font:700 min(3.6vw,6vh) "Source Serif 4",serif;color:var(--illum)}
.tvclue .live{font:700 min(3vw,5vh) "Source Sans 3";padding:.6vh 2vw;border-radius:1vh;background:var(--pv);color:var(--black)}
.tvclue .live.who{background:var(--illum);font:700 min(5vw,9vh) "Source Serif 4",serif}
.splash{font:700 min(9vw,15vh) "Source Serif 4",serif;color:var(--poppy)}
.tvlobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;text-align:center}
.tvlobby h1{font-size:min(5vw,9vh)}
#tvqrbig{background:#fff;padding:1.4vh;border-radius:1vh;line-height:0}
.tvurl{font:600 min(2vw,3.4vh) "Source Sans 3";color:var(--fog)}
.names{display:flex;flex-wrap:wrap;gap:1vh 1vw;justify-content:center;max-width:80vw}
.names span{background:var(--b90);padding:.6vh 1.2vw;border-radius:99px;font-size:min(1.8vw,3vh)}
.tvtbl{font-size:min(1.9vw,3.4vh)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== SETTINGS =====
 Host password hash (SHA-256). Default password: changeme
 To change it: open the site, click "Make a new password hash" on the lock screen,
 paste the result below, commit. */
const PASS_HASH="057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86";
const PREFIX="clubjep-";
/* Optional: add a TURN server here if phones still can't connect on some networks.
   Example: {urls:"turn:your.turn.host:3478",username:"user",credential:"pass"} */
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}];
const PEER_OPTS={config:{iceServers:ICE}};
/* ==================== */

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function toast(m){const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const money=n=>(n<0?"−":"")+"$"+Math.abs(n);
const bc="BroadcastChannel" in window?new BroadcastChannel("clubjep"):null;
const RV={r1:100,r2:200};

/* ---------- data ---------- */
const mk=()=>({dd:[],cats:Array.from({length:6},(_,i)=>({name:"Category "+(i+1),clues:Array.from({length:5},(_,j)=>({q:"Clue "+(j+1),a:"Answer "+(j+1)}))}))});
const blank=()=>({r1:mk(),r2:mk(),fin:{cat:"Final category",q:"Final clue",a:"Final answer"}});
const csvEsc=v=>{v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCSV(D){
  const rows=[["round","category","value","clue","answer","daily_double"]];
  ["r1","r2"].forEach((k,ri)=>D[k].cats.forEach((c,i)=>c.clues.forEach((x,j)=>rows.push([ri+1,c.name,RV[k]*(j+1),x.q,x.a,(D[k].dd||[]).includes(i+"-"+j)?"yes":""]))));
  rows.push(["final",D.fin.cat,"",D.fin.q,D.fin.a,""]);
  return "\ufeff"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
}
function parseCSV(t){
  t=t.replace(/^\ufeff/,"");const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
function fromCSV(t){
  const rows=parseCSV(t).filter(r=>r.some(x=>x.trim()));
  const hdr=rows.shift().map(h=>h.trim().toLowerCase()),ix=n=>hdr.indexOf(n);
  if(ix("round")<0||ix("clue")<0||ix("answer")<0)throw new Error("Needs round, category, value, clue, answer columns.");
  const N=blank(),seen={r1:[],r2:[]},filled={r1:{},r2:{}};
  N.r1.dd=[];N.r2.dd=[];
  rows.forEach(r=>{
    const g=n=>(r[ix(n)]??"").trim(),rd=g("round").toLowerCase();
    if(rd.startsWith("f")){N.fin={cat:g("category")||N.fin.cat,q:r[ix("clue")]??"",a:r[ix("answer")]??""};return}
    const k=/2/.test(rd)?"r2":"r1",name=g("category");
    let ci=seen[k].indexOf(name);if(ci<0){if(seen[k].length>=6)return;seen[k].push(name);ci=seen[k].length-1;N[k].cats[ci].name=name;filled[k][ci]={}}
    let j=Math.round(+g("value")/RV[k])-1;
    if(!(j>=0&&j<5)||filled[k][ci][j]){j=0;while(j<5&&filled[k][ci][j])j++;if(j>4)return}
    filled[k][ci][j]=1;N[k].cats[ci].clues[j]={q:r[ix("clue")]??"",a:r[ix("answer")]??""};
    if(/^(y|1|t|x|d)/i.test(g("daily_double")))N[k].dd.push(ci+"-"+j);
  });
  return N;
}

/* ======================= HOST CONSOLE ======================= */
let D,S={},U,P={},phase="idle",buzzer=null,out=new Set(),cur=null,dd={},tvAns=false,fin={stage:null};
let started=false,locked=false,tab="r1",round="r1",etab="r1",peer,room,tries=0;
function hostLoad(){
  try{D=JSON.parse(localStorage.jdata)}catch(e){}
  D=D||blank();["r1","r2"].forEach(k=>D[k].dd=D[k].dd||[]);
  try{S=JSON.parse(localStorage.jstate)||{}}catch(e){}
  U=S.used||{r1:{},r2:{}};started=!!S.started;
  Object.entries(S.scores||{}).forEach(([n,s])=>P[n]={name:n,score:s,online:false});
}
const saveD=()=>localStorage.jdata=JSON.stringify(D);
const saveS=()=>localStorage.jstate=JSON.stringify({used:U,started,scores:Object.fromEntries(Object.values(P).map(p=>[p.name,p.score]))});

function lockScreen(){
  if(sessionStorage.jok==="1")return hostInit();
  app.innerHTML=`<div class="center"><form class="card" id="lf"><h1>Club Jeopardy</h1>
  <label>Host password<input id="pw" type="password" autocomplete="current-password" autofocus></label>
  <button class="primary" style="width:100%">Unlock host console</button><div id="le" style="color:var(--spirit)"></div>
  <details><summary style="cursor:pointer" class="mute">Make a new password hash</summary><input id="np" placeholder="New password" style="margin:.5rem 0"><button type="button" id="mh" class="ghost">Generate</button><p id="ho" class="url" style="text-align:left;user-select:all"></p></details></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();if(await sha($("#pw").value)===PASS_HASH){sessionStorage.jok="1";hostInit()}else $("#le").textContent="Wrong password."};
  $("#mh").onclick=async()=>{$("#ho").textContent=$("#np").value?await sha($("#np").value):""};
}
function hostInit(){
  hostLoad();
  app.innerHTML=`<div id="host"><div id="main"></div><aside id="side"></aside></div><div id="ov"></div>`;
  if(bc)bc.onmessage=e=>{if(e.data==="hello")sync()};
  if(!localStorage.jdata)fetch("questions.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{D=fromCSV(t);saveD();renderMain()}).catch(()=>{});
  startRoom();renderSide();renderMain();
}
let hostStatus="Connecting to server…",rt=null;
const retry=ms=>{clearTimeout(rt);rt=setTimeout(startRoom,ms)};
function setStatus(s){hostStatus=s;if($("#side"))renderSide()}
function startRoom(){
  room=localStorage.jroom||(localStorage.jroom=Math.random().toString(36).slice(2,6));
  const old=peer;peer=null;if(old&&!old.destroyed)old.destroy();
  hostStatus="Connecting to server…";
  const me=peer=new Peer(PREFIX+room,PEER_OPTS);
  me.on("open",()=>{if(peer!==me)return;tries=0;setStatus("ok")});
  me.on("disconnected",()=>{if(peer!==me)return;setStatus("Lost the server connection. Reconnecting…");setTimeout(()=>{if(peer===me&&!me.destroyed)try{me.reconnect()}catch(e){retry(1000)}},1000)});
  me.on("close",()=>{if(peer!==me)return;setStatus("Room closed. Retrying…");retry(2000)});
  me.on("error",e=>{
    if(peer!==me)return;
    if(e.type==="unavailable-id"){
      setStatus("Room code already in use. Is the host page open in another tab? Retrying…");
      if(tries++<5)retry(2000);else{localStorage.jroom=Math.random().toString(36).slice(2,6);retry(500)}
    }else{
      setStatus("Problem: "+e.type+(["network","server-error","socket-error","socket-closed"].includes(e.type)?" (can't reach the PeerJS server). Retrying…":""));
      console.warn(e);if(["network","server-error","socket-error","socket-closed"].includes(e.type))retry(5000);
    }});
  me.on("connection",c=>{
    c.on("data",m=>onMsg(c,m));
    c.on("close",()=>{const p=P[c.pname];if(p&&p.conn===c){p.online=false;renderSide();sync()}});
  });
}
function onMsg(c,m){
  if(m.t==="join"){
    let n=String(m.name||"").trim().slice(0,16)||"Player",p=P[n];
    if(locked&&!p){c.send({t:"denied"});setTimeout(()=>c.close(),300);return}
    if(p&&p.online&&!m.rejoin){let i=2;while(P[n+i])i++;n+=i;p=null}
    if(!p)p=P[n]={name:n,score:0};
    p.conn=c;p.online=true;c.pname=n;c.send({t:"joined",name:n});push();renderSide();saveS();return;
  }
  const p=P[c.pname];if(!p)return;
  if(m.t==="buzz"&&phase==="open"&&!out.has(p.name)){phase="buzzed";buzzer=p.name;push();renderSide();renderPanel()}
  if(m.t==="wager"){
    if(phase==="final"&&fin.stage==="cat")p.wager=Math.max(0,Math.min(Math.floor(+m.v)||0,Math.max(p.score,0)));
    else if(phase==="dd"&&dd.stage==="wager"&&dd.who===p.name){p.wager=Math.max(0,Math.min(Math.floor(+m.v)||0,ddMax(p)));const w=$("#ddw");if(w)w.value=p.wager}
    else return;
    push();if(phase==="final")renderPanel();
  }
  if(m.t==="fans"&&phase==="final"&&fin.stage==="clue"){p.fans=String(m.v).slice(0,200);push();renderPanel()}
}
const ddMax=p=>Math.max(p.score,cur?RV[cur.r]*5:0);
function st(p){
  let s=phase;if(phase==="open"&&out.has(p.name))s="out";if(phase==="buzzed"&&buzzer===p.name)s="you";
  return {t:"s",s,buzzer,score:p.score,fin:fin.stage,cat:D.fin.cat,q:fin.stage==="clue"?D.fin.q:"",
    max:phase==="dd"?ddMax(p):Math.max(p.score,0),wager:p.wager,ans:p.fans,dd:phase==="dd"?{who:dd.who,stage:dd.stage}:null};
}
function push(){Object.values(P).forEach(p=>{if(p.online&&p.conn&&p.conn.open)p.conn.send(st(p))});sync()}

/* ----- TV sync ----- */
function joinUrl(){return location.origin+location.pathname+"?room="+room}
function tvState(){
  const ps=Object.values(P).sort((a,b)=>b.score-a.score),R=D[round];
  const cat=cur&&D[cur.r].cats[cur.c],cl=cur&&cat.clues[cur.j],val=cur?RV[cur.r]*(cur.j+1):0;
  const online=ps.filter(p=>p.online);
  return {started,url:joinUrl(),names:ps.map(p=>p.name),
    round,rname:round==="r1"?"Round 1":"Round 2",cats:R.cats.map(c=>c.name),used:U[round],vals:[1,2,3,4,5].map(j=>RV[round]*j),
    top:ps.slice(0,5).map(p=>({n:p.name,s:p.score})),more:Math.max(0,ps.length-5),phase,buzzer,
    cur:cur&&{cat:cat.name,val,dd:cur.dd,ddWho:dd.who,ddStage:dd.stage,q:(cur.dd&&dd.stage!=="clue")?"":cl.q,a:tvAns?cl.a:""},
    fin:phase==="final"?{stage:fin.stage,cat:D.fin.cat,q:fin.stage!=="cat"?D.fin.q:"",a:fin.stage==="reveal"?D.fin.a:"",
      nw:online.filter(p=>p.wager!=null).length,na:online.filter(p=>p.fans!=null).length,no:online.length,
      rows:fin.stage==="reveal"?ps.map(p=>({n:p.name,a:p.fans||"",w:p.wager||0,r:p.result||""})):[]}:null};
}
function sync(){if(bc)bc.postMessage(tvState())}

/* ----- sidebar: QR + players ----- */
function drawQR(el,size){el.innerHTML="";new QRCode(el,{text:joinUrl(),width:size,height:size})}
function renderSide(){
  const ps=Object.values(P);
  $("#side").innerHTML=`<h2 style="font-size:1.4rem">Join on your phone</h2>
  <div id="qrbox" title="Click to enlarge"></div><div class="url">${esc(joinUrl())}</div>
  <div class="stat ${hostStatus==="ok"?"good":"warn"}">${hostStatus==="ok"?"● Room online":"● "+esc(hostStatus)}</div>
  <div class="mini" style="justify-content:center"><button class="ghost" id="rc">Reconnect</button><button class="ghost" id="nr">New room code</button></div>
  <h3 style="margin:1rem 0 .2rem">Players (${ps.filter(p=>p.online).length} online)</h3>
  <div class="mini"><button class="ghost" id="ap">+ Add</button><button class="ghost" id="lk">Lobby: ${locked?"locked":"open"}</button><button class="ghost" id="ro">Remove offline</button></div>

  ${ps.sort((a,b)=>b.score-a.score).map(p=>`<div class="pl ${phase==="buzzed"&&buzzer===p.name?"hot":""}"><span class="dot ${p.online?"":"off"}"></span><span class="n ${p.online?"":"off"}">${esc(p.name)}</span>

  <button class="ghost" id="ng" style="margin-top:1rem;width:100%">New game (reset scores and board)</button>`;
  drawQR($("#qrbox"),170);
  $("#qrbox").onclick=()=>{$("#ov").innerHTML=`<div style="position:fixed;inset:0;background:#fff;color:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem"><div id="bq"></div><h2 style="font-size:2rem">Scan to join</h2><button class="primary" id="cq">Close</button></div>`;drawQR($("#bq"),Math.min(innerHeight*.6,innerWidth*.8));$("#cq").onclick=()=>$("#ov").innerHTML=""};
  const each=(a,f)=>$("#side").querySelectorAll(a).forEach(f);
  each("[data-sc]",b=>b.onclick=()=>{const n=b.dataset.sc,v=prompt("Score for "+n,P[n].score);if(v!==null&&v.trim()!==""&&!isNaN(+v)){P[n].score=+v;saveS();push();renderSide()}});
  each("[data-rn]",b=>b.onclick=()=>{const o=b.dataset.rn,n=(prompt("New name for "+o,o)||"").trim().slice(0,16);if(!n||n===o||P[n])return;const p=P[o];delete P[o];p.name=n;P[n]=p;if(p.conn){p.conn.pname=n;if(p.conn.open)p.conn.send({t:"joined",name:n})}if(buzzer===o)buzzer=n;saveS();push();renderSide();renderPanel()});
  each("[data-rm]",b=>b.onclick=()=>{if(confirm("Remove "+b.dataset.rm+" from the lobby?"))kick(b.dataset.rm)});
  $("#ap").onclick=()=>{const n=(prompt("Player or team name")||"").trim().slice(0,16);if(n&&!P[n]){P[n]={name:n,score:0,online:false};saveS();push();renderSide()}};
  $("#rc").onclick=()=>{tries=0;setStatus("Reconnecting…");retry(0);toast("Reconnecting the room…")};
  $("#nr").onclick=()=>{if(!confirm("Create a new room code? Everyone connected is disconnected and must scan the new QR code."))return;
    Object.values(P).forEach(p=>{if(p.conn&&p.conn.open){try{p.conn.send({t:"closed"})}catch(e){}}});
    P={};phase="idle";cur=null;buzzer=null;fin={stage:null};localStorage.jroom=Math.random().toString(36).slice(2,6);tries=0;saveS();renderMain();retry(0);setStatus("Connecting to server…");toast("New room code: "+localStorage.jroom)};
  $("#lk").onclick=()=>{locked=!locked;renderSide()};
  $("#ro").onclick=()=>{const off=ps.filter(p=>!p.online);if(off.length&&confirm("Remove "+off.length+" offline player(s)? Their scores are lost."))off.forEach(p=>kick(p.name))};

}
function kick(n){
  const p=P[n];if(!p)return;
  if(p.conn&&p.conn.open){p.conn.send({t:"kicked"});const c=p.conn;setTimeout(()=>c.close(),300)}
  delete P[n];if(buzzer===n){buzzer=null;if(phase==="buzzed")phase="open"}
  if(dd.who===n){dd.who=null;dd.stage="pick"}
  saveS();push();renderSide();renderPanel();
}

/* ----- main: tabs, board, editor ----- */
function renderMain(){
  const m=$("#main"),tabs=[["r1","Round 1"],["r2","Round 2"],["fin","Final Jeopardy"],["edit","Editor"]];
  m.innerHTML=`<div class="bar">${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}<span class="sp"></span>
  <button class="ghost" id="tvb">Open TV display</button><button class="${started?"ghost":"primary"}" id="gb">${started?"Back to lobby screen":"Start game"}</button></div><div id="panel"></div><div id="body"></div>`;
  const b=$("#body");
  if(tab==="r1"||tab==="r2"){
    const R=D[tab];
    b.innerHTML=`<div class="board">${R.cats.map(c=>`<div class="cat">${esc(c.name)}</div>`).join("")}${
      [0,1,2,3,4].map(j=>R.cats.map((c,i)=>{const u=U[tab][i+"-"+j],star=R.dd.includes(i+"-"+j);return `<button class="tile ${u?"used":""}" data-c="${i}" data-j="${j}" ${u?"disabled":""}>$${RV[tab]*(j+1)}${star&&!u?'<span class="star" title="Daily Double (host only)">★</span>':""}</button>`}).join("")).join("")}</div>
    <p class="mute" style="margin-top:.8rem">Click a tile to open it. The ★ marks a Daily Double and only shows here, never on the TV.</p>`;
  }else if(tab==="fin"){
    b.innerHTML=`<div class="card" style="width:min(560px,100%)"><h1>Final Jeopardy</h1><p>Category: <b>${esc(D.fin.cat)}</b></p><p class="mute">Players set a wager on their phones, then type an answer. You mark each one right or wrong.</p><button class="primary" id="sf">Start Final Jeopardy</button></div>`;
  }else{b.innerHTML=editorHTML();bindEditor()}
  m.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{tab=x.dataset.tab;if(tab==="r1"||tab==="r2")round=tab;renderMain()});
  b.querySelectorAll(".tile:not(.used)").forEach(x=>x.onclick=()=>openClue(+x.dataset.c,+x.dataset.j));
  $("#tvb").onclick=()=>window.open(location.pathname+"?tv","jeopardy-tv","popup,width=1280,height=720");
  $("#gb").onclick=()=>{started=!started;saveS();renderMain()};
  if($("#sf"))$("#sf").onclick=()=>{Object.values(P).forEach(p=>{delete p.wager;delete p.fans;delete p.result});started=true;saveS();phase="final";fin={stage:"cat"};cur=null;push();renderMain()};
  renderPanel();sync();
}
function openClue(c,j){
  cur={r:tab,c,j,dd:D[tab].dd.includes(c+"-"+j)};round=tab;tvAns=false;buzzer=null;out=new Set();dd={who:null,stage:"pick"};
  phase=cur.dd?"dd":"locked";started=true;saveS();push();renderPanel();renderMain();
}
function closeClue(used){
  if(used&&cur)U[cur.r][cur.c+"-"+cur.j]=1;
  if(cur&&dd.who&&P[dd.who])delete P[dd.who].wager;
  cur=null;phase="idle";buzzer=null;saveS();push();renderSide();renderMain();
}
const curVal=()=>RV[cur.r]*(cur.j+1);
function judge(name,ok){
  const p=P[name];if(!p)return;
  if(ok){p.score+=curVal();closeClue(true);return}
  p.score-=curVal();out.add(name);buzzer=null;if(phase==="buzzed")phase="open";
  saveS();push();renderSide();renderPanel();
}
function ddJudge(ok){const p=P[dd.who];if(!p)return;const w=Math.max(0,+$("#ddw").value||0);p.score+=ok?w:-w;closeClue(true)}

function renderPanel(){
  const el=$("#panel");if(!el)return;
  if(phase==="final")return panelFinal(el);
  if(!cur){el.innerHTML="";return}
  const cat=D[cur.r].cats[cur.c],cl=cat.clues[cur.j],val=curVal(),ps=Object.values(P);
  const head=`<div class="ph"><span>${esc(cat.name)} · $${val}</span>${cur.dd?'<span class="badge">Daily Double</span>':""}</div><div class="pq">${esc(cl.q)}</div><div class="pa">Answer (host only): ${esc(cl.a)}</div>`;
  const foot=`<div class="ctl"><button class="ghost" id="sa">${tvAns?"Hide answer on TV":"Show answer on TV"}</button><button class="ghost" id="done">Done (mark used)</button><button class="ghost" id="back">Back (keep unused)</button></div>`;
  let mid="";
  if(cur.dd){
    if(dd.stage==="pick")mid=`<div class="ctl"><span>Who gets the Daily Double?</span>${ps.map(p=>`<button data-pick="${esc(p.name)}">${esc(p.name)}</button>`).join("")||'<span class="mute">No players yet.</span>'}</div>`;
    else{const p=P[dd.who];mid=`<div class="ctl"><span class="who">${esc(dd.who)}</span><label>Wager $<input id="ddw" type="number" min="0" value="${p&&p.wager!=null?p.wager:""}"></label>
      ${dd.stage==="wager"?`<button class="primary" id="ddshow">Show clue on TV</button>`:`<button class="ok" id="ddok">Correct</button><button class="bad" id="ddno">Incorrect</button>`}<button class="ghost" id="ddre">Change player</button></div>
      ${dd.stage==="wager"?'<p class="mute">The player can enter their wager on their phone, or type it here.</p>':""}`}
  }else{
    if(phase==="locked")mid=`<div class="ctl"><button class="primary" id="ob">Open buzzers</button></div>`;
    if(phase==="open")mid=`<div class="ctl"><span>Buzzers open…</span><button id="lb">Lock buzzers</button></div>`;
    if(phase==="buzzed")mid=`<div class="ctl"><span class="who">${esc(buzzer)}</span><button class="ok" id="ok">Correct +${val}</button><button class="bad" id="no">Incorrect −${val}</button></div>`;
    mid+=`<div class="ctl"><span class="mute">Judge someone else:</span><select id="mp">${ps.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><button class="ok" id="mok">✓</button><button class="bad" id="mno">✗</button></div>`;
  }
  el.innerHTML=head+mid+foot;
  const on=(id,f)=>$(id)&&($(id).onclick=f);
  on("#ob",()=>{phase="open";push();renderSide();renderPanel()});
  on("#lb",()=>{phase="locked";push();renderPanel()});
  on("#ok",()=>judge(buzzer,true));on("#no",()=>judge(buzzer,false));
  on("#mok",()=>judge($("#mp").value,true));on("#mno",()=>judge($("#mp").value,false));
  on("#sa",()=>{tvAns=!tvAns;renderPanel();sync()});
  on("#done",()=>closeClue(true));on("#back",()=>closeClue(false));
  el.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{dd={who:b.dataset.pick,stage:"wager"};push();renderPanel()});
  on("#ddshow",()=>{const p=P[dd.who];p.wager=Math.max(0,+$("#ddw").value||0);dd.stage="clue";push();renderPanel()});
  on("#ddok",()=>ddJudge(true));on("#ddno",()=>ddJudge(false));
  on("#ddre",()=>{dd={who:null,stage:"pick"};push();renderPanel()});
}
function panelFinal(el){
  const f=D.fin,ps=Object.values(P);let body="",ctl="";
  if(fin.stage==="cat"){body=`<div class="pq">Category: ${esc(f.cat)}</div><table>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.wager!=null?"$"+p.wager:"…"}</td></tr>`).join("")}</table>`;ctl=`<button class="primary" id="n1">Show clue, collect answers</button>`}
  if(fin.stage==="clue"){body=`<div class="pq">${esc(f.q)}</div><div class="pa">Answer: ${esc(f.a)}</div><table>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.fans!=null?"answered":"…"}</td></tr>`).join("")}</table>`;ctl=`<button class="primary" id="n2">Reveal answers on TV</button>`}
  if(fin.stage==="reveal"){body=`<div class="pa">Answer: ${esc(f.a)}</div><table><tr><th>Player</th><th>Answer</th><th>Wager</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.name)} (${money(p.score)})</td><td>${esc(p.fans||"(none)")}</td><td>$${p.wager||0}</td><td>${p.result?(p.result==="ok"?"✓ scored":"✗ scored"):`<button class="ok" data-r="${esc(p.name)}" data-v="1">✓</button> <button class="bad" data-r="${esc(p.name)}" data-v="-1">✗</button>`}</td></tr>`).join("")}</table>`}
  el.innerHTML=`<div class="ph">Final Jeopardy</div>${body}<div class="ctl">${ctl}<button class="ghost" id="fx">Close final</button></div>`;
  const on=(id,fn)=>$(id)&&($(id).onclick=fn);
  on("#n1",()=>{fin.stage="clue";push();renderPanel()});on("#n2",()=>{fin.stage="reveal";push();renderPanel()});
  on("#fx",()=>{phase="idle";fin={stage:null};push();renderPanel()});
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const p=P[b.dataset.r],v=+b.dataset.v;p.score+=v*(p.wager||0);p.result=v>0?"ok":"no";saveS();renderSide();push();renderPanel()});
}

function bindEditor(){
  const b=$("#body");
  b.oninput=e=>{const d=e.target.dataset;if(!d.k)return;
    if(d.k==="fin")D.fin[d.f]=e.target.value;
    else if(d.f==="name")D[d.k].cats[+d.c].name=e.target.value;
    else D[d.k].cats[+d.c].clues[+d.j][d.f]=e.target.value;
    saveD();sync()};
  b.querySelectorAll("[data-et]").forEach(x=>x.onclick=()=>{etab=x.dataset.et;renderMain()});
  b.querySelectorAll("[data-dd]").forEach(x=>x.onclick=()=>{const a=D[etab].dd,v=x.dataset.dd,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);x.classList.toggle("on",i<0);x.setAttribute("aria-pressed",i<0);saveD()});
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([toCSV(D)],{type:"text/csv"}));a.download="questions.csv";a.click()};
  $("#im").onclick=()=>$("#fi").click();
  $("#fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const N=fromCSV(await f.text());if(confirm("Replace all current questions with this file?")){D=N;saveD();renderMain()}}catch(x){alert("Couldn't read that CSV. "+x.message)}e.target.value=""};
  $("#lq").onclick=()=>fetch("questions.csv",{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{if(confirm("Replace all current questions with questions.csv from the site?")){D=fromCSV(t);saveD();renderMain()}}).catch(()=>alert("No questions.csv found next to index.html."));
}

/* ======================= PLAYER ======================= */
function playerMode(code){
  let name=localStorage.jname||"",conn,state={s:"idle"},dead=false;
  const msgCard=(t,p)=>app.innerHTML=`<div class="center"><div class="card"><h1>${t}</h1><p>${p}</p></div></div>`;
  const join=()=>{
    app.innerHTML=`<div class="center"><form class="card" id="jf"><h1>Join the game</h1><label>Your name<input id="nm" maxlength="16" value="${esc(name)}" autofocus autocomplete="nickname"></label><button class="primary" style="width:100%">Join</button></form></div>`;
    $("#jf").onsubmit=e=>{e.preventDefault();name=$("#nm").value.trim();if(!name)return;localStorage.jname=name;connect()};
  };
  let att=0;
  const connect=()=>{
    dead=false;app.innerHTML=`<div class="center"><p>Connecting…</p></div>`;
    const pr=new Peer(PEER_OPTS);let opened=false,to;
    const fail=why=>{if(dead||opened)return;clearTimeout(to);app.innerHTML=`<div class="center"><div class="card"><h1>Can't find the game</h1><p>${why}</p><button class="primary" id="rt">Try again</button></div></div>`;$("#rt").onclick=()=>{att=0;pr.destroy();connect()}};
    pr.on("open",()=>{conn=pr.connect(PREFIX+code,{reliable:true});
      to=setTimeout(()=>fail("Reached the server but couldn't open a direct line to the host. A network or VPN is probably blocking it. (timeout)"),20000);
      conn.on("open",()=>{opened=true;att=0;clearTimeout(to);conn.send({t:"join",name,rejoin:!!localStorage.jjoined})});
      conn.on("data",m=>{
        if(m.t==="joined"){name=m.name;localStorage.jname=name;localStorage.jjoined="1";ui()}
        if(m.t==="s"){state=m;ui()}
        if(m.t==="kicked"){dead=true;localStorage.removeItem("jjoined");msgCard("You were removed","The host removed you from the game.")}
        if(m.t==="closed"){dead=true;localStorage.removeItem("jjoined");msgCard("Room closed","The host started a new room. Scan the new QR code to join.")}
        if(m.t==="denied"){dead=true;msgCard("Lobby is closed","The host isn't accepting new players right now.")}
      });
      conn.on("close",()=>{if(dead)return;app.innerHTML=`<div class="center"><p>Reconnecting…</p></div>`;setTimeout(()=>{pr.destroy();connect()},1500)});
    });
    pr.on("error",e=>{
      if(e.type==="peer-unavailable"&&att++<3){clearTimeout(to);pr.destroy();setTimeout(connect,2000);return}
      const m={"peer-unavailable":"The host's room isn't online. Check that the host page is open and unlocked, with \"Room online\" showing in the sidebar.",
        "network":"Couldn't reach the connection server. Check your internet.","server-error":"Couldn't reach the connection server.","socket-error":"Couldn't reach the connection server.","socket-closed":"Couldn't reach the connection server.",
        "webrtc":"Couldn't open a direct line to the host. A network or VPN may be blocking it."};
      fail((m[e.type]||"Something went wrong.")+" ("+e.type+")");
    });
  };
  const wagerForm=(max,w)=>`<form id="wf"><label>Your wager (0–${max})<input id="wv" type="number" min="0" max="${max}" inputmode="numeric" value="${w??""}" required></label><button class="primary" style="width:100%;margin-top:.6rem">Lock in wager</button></form>${w!=null?`<p>Wager set: $${w}</p>`:""}`;
  const ui=()=>{
    const s=state,top=`<div id="pinfo"><span>${esc(name)}</span><span>${money(s.score||0)}</span></div>`;
    if(s.s==="final"||s.s==="dd"){
      let body="";
      if(s.s==="final"){
        body=`<h1>Final Jeopardy</h1><p><b>${esc(s.cat)}</b></p>`+
        (s.fin==="cat"?wagerForm(s.max,s.wager):"")+
        (s.fin==="clue"?`<p>${esc(s.q)}</p><form id="af"><label>Your answer<input id="av" value="${esc(s.ans||"")}" maxlength="200" required></label><button class="primary" style="width:100%;margin-top:.6rem">Submit answer</button></form>${s.ans!=null?"<p>Submitted.</p>":""}`:"")+
        (s.fin==="reveal"?"<p>Watch the main screen.</p>":"");
      }else{
        const me=s.dd.who===name;
        body=`<h1>Daily Double</h1>`+(s.dd.stage==="pick"?"<p>The host is choosing a player.</p>":s.dd.stage==="wager"?(me?wagerForm(s.max,s.wager):`<p>${esc(s.dd.who)} is wagering.</p>`):(me?"<p>Answer out loud. The host will judge it.</p>":`<p>${esc(s.dd.who)} is answering.</p>`));
      }
      app.innerHTML=`<div id="player">${top}<div class="card" style="width:100%;max-width:none">${body}</div></div>`;
      if($("#wf"))$("#wf").onsubmit=e=>{e.preventDefault();conn.send({t:"wager",v:$("#wv").value})};
      if($("#af"))$("#af").onsubmit=e=>{e.preventDefault();conn.send({t:"fans",v:$("#av").value})};
      return;
    }
    const L={idle:"WAIT",locked:"WAIT",open:"BUZZ!",out:"OUT",buzzed:"WAIT",you:"YOU!"};
    const msg={idle:"Waiting for the next clue",locked:"Hold on. Buzzers open soon.",open:"",out:"Locked out for this clue",buzzed:s.buzzer?esc(s.buzzer)+" buzzed in":"",you:"You buzzed in first. Answer out loud!"}[s.s]||"";
    app.innerHTML=`<div id="player">${top}<button id="buzz" class="${s.s}" ${s.s==="open"?"":"disabled"}>${L[s.s]||"WAIT"}</button><div id="pmsg">${msg}</div></div>`;
    const b=$("#buzz");
    if(s.s==="open")b.onpointerdown=e=>{e.preventDefault();conn.send({t:"buzz"});if(navigator.vibrate)navigator.vibrate(60);b.disabled=true};
  };
  name?connect():join();
}

/* ======================= ROUTER (must stay last) ======================= */
const qs=new URLSearchParams(location.search);
if(qs.get("room"))playerMode(qs.get("room"));
else if(qs.has("tv"))tvMode();
else lockScreen();
</script>
